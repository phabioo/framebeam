{{define "content"}}
<div class="confirm stack">
  <div class="page-head"><div><h1>{{.Body.Heading}}</h1><p class="sub">{{.Body.Intro}}</p></div></div>
  <div class="card confirm-card">
    <ul class="confirm-list">{{range .Body.Removes}}<li>{{.}}</li>{{end}}</ul>
    {{if .Body.Note}}<p class="help">{{.Body.Note}}</p>{{end}}
    <form class="confirm-actions" method="post" action="{{.Body.Action}}">
      <input type="hidden" name="_csrf" value="{{.CSRF}}">
      <a class="btn" href="{{.Body.Cancel}}">Cancel</a>
      <button class="btn danger" type="submit">{{.Body.Button}}</button>
    </form>
  </div>
</div>
{{end}}
