version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: [minor, patch]
  # The vcpkg builtin-baseline in client/vcpkg.json is the only vcpkg pin (scripts/bootstrap-vcpkg.sh reads it, scripts/check-vcpkg-pin.sh checks it).
  # A bump changes the Windows DLLs shipped in the MSI: review the PR, the Windows CI run is the test.
  - package-ecosystem: vcpkg
    directory: /client
    schedule:
      interval: monthly
