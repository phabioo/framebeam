name: CI (branch)

# Pushes to branches other than main run the CI workflow (ci.yml) through this wrapper, unless the branch has an open
# pull request: then the pull_request run of ci.yml builds the same commit, and a second run would double the minutes.
# The called jobs report as "CI (branch) / ..." and therefore never share a check name with the required checks of the
# PR run ("Hub (Go, Linux)" etc.); a skipped duplicate could otherwise be mistaken for a passing required check.
# Tag pushes never match the branch filter. Pushes to main run ci.yml directly (it has its own push trigger).

on:
  push:
    # Dependabot branches always get a PR at once, and their push token is read-only (ci.yml's version job needs write).
    branches-ignore: [main, 'dependabot/**']

concurrency:
  group: ci-branch-caller-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr:
    name: Check for an open PR
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      skip: ${{ steps.lookup.outputs.skip }}
    steps:
      - name: Look up an open PR for this branch
        id: lookup
        env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Any lookup problem means: run the CI (never skip on error).
          set -uo pipefail
          skip=false
          n=""
          for attempt in 1 2 3; do
            if n="$(gh pr list --head "$BRANCH" --state open --json number --jq length 2>/dev/null)" && [[ "$n" =~ ^[0-9]+$ ]]; then break; fi
            n=""; sleep $((attempt * 2))
          done
          if [ -z "$n" ]; then
            echo "open-PR lookup failed: the CI runs"
          elif [ "$n" -gt 0 ]; then
            skip=true
            echo "branch $BRANCH has an open PR: its pull_request run covers this commit, no branch run"
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "skip=$skip" >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: CI
    needs: pr
    if: needs.pr.outputs.skip != 'true'
    # A called workflow cannot get more permissions than its caller grants: ci.yml's version job declares contents: write
    # (used only to reserve the tag on pushes to main; branch runs never write).
    permissions:
      contents: write
    uses: ./.github/workflows/ci.yml
