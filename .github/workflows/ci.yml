name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hub:
    name: Hub (Go, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Check Hub
        run: make check-hub
      - name: Build Hub (linux amd64 + arm64)
        run: |
          HUB_VERSION="$(git rev-parse --short=8 HEAD)" make build-hub
      - uses: actions/upload-artifact@v4
        with:
          name: framebeam-hub-linux
          path: |
            server/dist/framebeam-hub-linux-amd64
            server/dist/framebeam-hub-linux-arm64
          if-no-files-found: error
          retention-days: 3

  client-linux:
    name: Player (C++, Linux)
    runs-on: ubuntu-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
    steps:
      - uses: actions/checkout@v4
      - name: Cache vcpkg checkout
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}
          key: vcpkg-root-${{ runner.os }}-${{ hashFiles('scripts/bootstrap-vcpkg.sh', 'client/vcpkg.json') }}
      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-bin-${{ runner.os }}-${{ hashFiles('client/vcpkg.json') }}
          restore-keys: vcpkg-bin-${{ runner.os }}-
      - name: Cache melonDS DS core
        uses: actions/cache@v4
        with:
          path: ~/.cache/framebeam/cores
          key: melondsds-core-linux-${{ hashFiles('scripts/melonds-ds.pin', 'scripts/fetch-melonds-ds.sh') }}
      - name: Cache libdatachannel
        uses: actions/cache@v4
        with:
          path: ~/.cache/framebeam/deps
          key: libdatachannel-linux-${{ hashFiles('scripts/libdatachannel.pin', 'scripts/fetch-libdatachannel.sh') }}
      - name: Provision tools and Qt 6.4
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build qt6-base-dev qt6-declarative-dev qt6-multimedia-dev \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-window qml6-module-qtqml-workerscript qml6-module-qtquick-templates \
            libgl-dev libepoxy-dev xvfb libavcodec-dev libswscale-dev libopus-dev \
            qt6-websockets-dev libssl-dev pkg-config
      - name: Bootstrap vcpkg
        run: scripts/bootstrap-vcpkg.sh
      - name: Check Player
        run: xvfb-run -a make check-client

  client-windows:
    name: Player (C++, Windows MSVC)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}\.vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-binary-cache
    steps:
      - uses: actions/checkout@v4
      - name: Cache vcpkg checkout
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}
          key: vcpkg-root-${{ runner.os }}-${{ hashFiles('client/vcpkg.json') }}
      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-bin-${{ runner.os }}-${{ hashFiles('client/vcpkg.json') }}
          restore-keys: vcpkg-bin-${{ runner.os }}-
      - name: Bootstrap vcpkg at baseline commit
        shell: pwsh
        run: |
          # Own checkout instead of VCPKG_INSTALLATION_ROOT: the runner's copy is
          # not pinned to builtin-baseline and its version database may be missing.
          $baseline = (Get-Content client/vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          if (-not (Test-Path "$env:VCPKG_ROOT/vcpkg.exe")) {
            New-Item -ItemType Directory -Force $env:VCPKG_ROOT | Out-Null
            git -C $env:VCPKG_ROOT init -q
            git -C $env:VCPKG_ROOT remote add origin https://github.com/microsoft/vcpkg
            git -C $env:VCPKG_ROOT fetch -q --depth 1 origin $baseline
            git -C $env:VCPKG_ROOT checkout -q --force $baseline
            & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
            if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed" }
          }
      - name: Cache melonDS DS core
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\.framebeam-cache\cores
          key: melondsds-core-windows-${{ hashFiles('scripts/melonds-ds.pin', 'scripts/fetch-melonds-ds.ps1') }}
      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.*
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia qtwebsockets
          cache: true
      - name: Provision melonDS DS core
        id: core
        shell: pwsh
        env:
          FRAMEBEAM_CACHE_DIR: ${{ github.workspace }}\.framebeam-cache
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $dll = scripts/fetch-melonds-ds.ps1 | Select-Object -Last 1
          "dll=$dll" >> $env:GITHUB_OUTPUT
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        working-directory: client
        run: cmake --preset windows-msvc-release "-DFRAMEBEAM_MELONDS_DS_CORE=${{ steps.core.outputs.dll }}"
      # Save the binary cache right after vcpkg install (part of configure), even if
      # later steps fail, so a long FFmpeg build is never repeated.
      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-bin-${{ runner.os }}-${{ hashFiles('client/vcpkg.json') }}
      - name: Build
        working-directory: client
        run: cmake --build --preset windows-msvc-release
      - name: Test
        working-directory: client
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # The core is always present in CI: skipped tests (e.g. emulation_core) count as failures.
          ctest --preset windows-msvc-release 2>&1 | Tee-Object -FilePath ctest.log
          if ($LASTEXITCODE -ne 0) {
            # Re-run every failed test exe directly: QtTest output goes to a file (survives a crash) and to the
            # console, followed by the files and the exit code (0xC0000005 = access violation, 3/4 = abort/terminate).
            $failed = Select-String -Path ctest.log -Pattern '^\s*\d+/\d+ Test\s+#\d+: (\S+) \.+\*{3}(Failed|Exception|Timeout)' |
              ForEach-Object { $_.Matches[0].Groups[1].Value } | Sort-Object -Unique
            foreach ($t in $failed) {
              $exe = Get-ChildItem -Recurse -Filter "test_$t.exe" | Select-Object -First 1
              if (-not $exe) { Write-Host "::warning::no exe for $t"; continue }
              Write-Host "::group::rerun $t ($($exe.FullName))"
              # Same environment as under ctest (core path, test ROM, offscreen): read from the test properties.
              $props = (ctest --preset windows-msvc-release -R "^$t$" --show-only=json-v1 | ConvertFrom-Json).tests[0].properties
              foreach ($kv in (($props | Where-Object { $_.name -eq 'ENVIRONMENT' }).value)) {
                $k, $v = $kv -split '=', 2
                Set-Item -Path "env:$k" -Value $v
              }
              Push-Location $exe.DirectoryName
              $out = & $exe.FullName -v2 -o "$t.txt,txt" 2>&1 | ForEach-Object { "$_" }
              $code = $LASTEXITCODE
              Pop-Location
              Write-Host "exit code of ${t}: $code (0x$('{0:X}' -f $code))"
              # Filtered view: failures with 5 lines of context, warnings, totals, guard messages (no QINFO noise).
              $out | Select-String -Pattern 'FAIL!|QWARN|QFATAL|Totals|\[fbtest\]|\[uitest\]|Loc:|XPASS' -Context 5,2 | Out-Host
              Write-Host "::endgroup::"
            }
            throw "ctest failed"
          }
          if (Select-String -Path ctest.log -Pattern '\(Skipped\)' -Quiet) { throw "Tests were skipped although the core should be present" }
      - name: Assemble package (windeployqt)
        shell: pwsh
        run: |
          $dist = "$env:GITHUB_WORKSPACE\dist\framebeam-player"
          New-Item -ItemType Directory -Force $dist, "$dist\cores" | Out-Null
          # qt_standard_project_setup may not place executables in app\ on Windows: search for it.
          $exe = @(Get-ChildItem -Recurse -Filter framebeam_player.exe client\build\windows-msvc-release)
          if ($exe.Count -ne 1) { throw "framebeam_player.exe not found unambiguously: $($exe.FullName -join ', ')" }
          Write-Host "Executable: $($exe[0].FullName)"
          Copy-Item $exe[0].FullName $dist
          windeployqt --release --no-translations --qmldir client\ui "$dist\framebeam_player.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }
          $dll = "${{ steps.core.outputs.dll }}"
          Copy-Item $dll "$dist\cores\"
          Copy-Item (Join-Path (Split-Path $dll) 'LICENSE-melonDS-DS.txt') $dist
          @"
          This package contains the libretro core melonDS DS (JesseTG/melonds-ds, GPL-3.0),
          cores\melondsds_libretro.dll. License text: LICENSE-melonDS-DS.txt.
          Source code: https://github.com/JesseTG/melonds-ds
          Contains no ROMs, BIOS or firmware.
          "@ | Set-Content "$dist\THIRD-PARTY-NOTICE.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: framebeam-player-windows-x64
          path: dist/framebeam-player
          if-no-files-found: error
          retention-days: 7
