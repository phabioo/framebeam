name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Build version and channel, computed once (spec 0.3 S1): tag vX.Y.Z -> stable, push to main -> beta, else dev.
  # A workflow_dispatch on a v* tag (started by promote.yml, tags created with GITHUB_TOKEN trigger no push) counts like a tag push.
  version:
    name: Version and channel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      core: ${{ steps.v.outputs.core }}
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
      commit: ${{ steps.v.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute version and channel
        id: v
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          core="$(tr -d '[:space:]' < VERSION)"
          [[ "$core" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::VERSION must be X.Y.Z, found '$core'"; exit 1; }
          if { [ "$EVENT" = push ] || [ "$EVENT" = workflow_dispatch ]; } && [[ "$REF" == refs/tags/v* ]]; then
            [ "${REF_NAME#v}" = "$core" ] || { echo "::error title=Tag does not match VERSION::tag $REF_NAME but VERSION is $core"; exit 1; }
            version="$core"; channel="stable"
          elif [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then
            version="$core-beta.$RUN_NUMBER"; channel="beta"
          else
            version="$core-dev.$RUN_NUMBER"; channel="dev"
          fi
          {
            echo "core=$core"
            echo "version=$version"
            echo "channel=$channel"
            echo "commit=$SHA"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version, channel $channel" >> "$GITHUB_STEP_SUMMARY"

  # Docs-only gate: true only for PRs and non-main branch pushes whose diff touches nothing but docs/** and *.md.
  # Pushes classify the whole branch vs main (origin/main...sha), not just the last push, so a docs-only push that
  # cancels an earlier code run (concurrency) still runs the builds. PRs use base...head.
  # Always false for main (beta release, Windows cache priming per ADR 0008), v* tags and workflow_dispatch.
  changes:
    name: Detect docs-only changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.d.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: d
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          docs_only=false
          reason=""
          range=""
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE...$PR_HEAD"
          elif [ "$EVENT" = push ] && [ "$REF" != refs/heads/main ] && [[ "$REF" != refs/tags/* ]]; then
            # Whole branch since the merge base with main (covers new branches and cancelled earlier runs).
            git rev-parse --verify -q refs/remotes/origin/main >/dev/null || git fetch --no-tags origin main || true
            if git rev-parse --verify -q refs/remotes/origin/main >/dev/null && git merge-base origin/main "$SHA" >/dev/null 2>&1; then
              range="origin/main...$SHA"
            else
              reason="origin/main or merge base not available"
            fi
          else
            reason="event $EVENT on $REF always runs the full pipeline"
          fi
          files=()
          if [ -n "$range" ]; then
            while IFS= read -r -d '' f; do files+=("$f"); done < <(git diff --name-only --no-renames -z "$range")
            if [ "${#files[@]}" -eq 0 ]; then
              reason="empty diff"
            else
              docs_only=true
              for f in "${files[@]}"; do
                case "$f" in
                  docs/* | *.md) ;;
                  *) docs_only=false; reason="non-docs path: $f"; break ;;
                esac
              done
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          {
            echo "### Docs-only detection"
            echo "docs_only=$docs_only ${reason:+($reason)}"
            if [ "${#files[@]}" -gt 0 ]; then
              echo "Changed files (\`$range\`):"
              printf -- '- %s\n' "${files[@]}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  hub:
    name: Hub (Go, Linux)
    # Skipped for docs-only changes (see job changes); a skipped job counts as passing for required checks.
    if: needs.changes.outputs.docs_only != 'true'
    needs: [version, changes]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUB_VERSION: ${{ needs.version.outputs.version }}
      HUB_CHANNEL: ${{ needs.version.outputs.channel }}
      HUB_COMMIT: ${{ needs.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Check Hub
        run: make check-hub
      - name: Build Hub (linux amd64 + arm64) and .deb packages
        run: |
          make build-hub
          make package-hub-deb
          # The amd64 binary runs on the runner: its version --json is the release info of the Hub.
          server/dist/framebeam-hub-linux-amd64 version --json > server/dist/hub-release-info.json
          cat server/dist/hub-release-info.json
          grep -qF "\"version\":\"$HUB_VERSION\"" server/dist/hub-release-info.json
          grep -qF "\"channel\":\"$HUB_CHANNEL\"" server/dist/hub-release-info.json
          ls -l server/dist
      - name: E2E Hub install and update (systemd)
        # Real install on the runner: install-hub.sh, .deb migration, signed update round trip (uses sudo).
        run: scripts/e2e-hub-update.sh
      - uses: actions/upload-artifact@v4
        with:
          name: framebeam-hub-linux
          path: |
            server/dist/framebeam-hub-linux-amd64
            server/dist/framebeam-hub-linux-arm64
            server/dist/framebeam-hub_*.deb
            server/dist/hub-release-info.json
          if-no-files-found: error
          retention-days: 7

  client-linux:
    name: Player (C++, Linux)
    # Skipped for docs-only changes (see job changes).
    if: needs.changes.outputs.docs_only != 'true'
    needs: [version, changes]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      FRAMEBEAM_VERSION: ${{ needs.version.outputs.version }}
      FRAMEBEAM_CHANNEL: ${{ needs.version.outputs.channel }}
      FRAMEBEAM_COMMIT: ${{ needs.version.outputs.commit }}
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
    steps:
      - uses: actions/checkout@v4
      - name: Cache vcpkg checkout
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}
          key: vcpkg-root-${{ runner.os }}-${{ hashFiles('scripts/bootstrap-vcpkg.sh', 'client/vcpkg.json') }}
      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-bin-${{ runner.os }}-${{ hashFiles('client/vcpkg.json') }}
          restore-keys: vcpkg-bin-${{ runner.os }}-
      - name: Cache melonDS DS core
        uses: actions/cache@v4
        with:
          path: ~/.cache/framebeam/cores
          key: melondsds-core-linux-${{ hashFiles('scripts/melonds-ds.pin', 'scripts/fetch-melonds-ds.sh') }}
      - name: Cache libdatachannel
        uses: actions/cache@v4
        with:
          path: ~/.cache/framebeam/deps/libdatachannel
          key: libdatachannel-linux-${{ hashFiles('scripts/libdatachannel.pin', 'scripts/fetch-libdatachannel.sh') }}
      - name: Cache SDL3
        uses: actions/cache@v4
        with:
          path: ~/.cache/framebeam/deps/sdl3
          key: sdl3-linux-${{ hashFiles('scripts/sdl3.pin', 'scripts/fetch-sdl3.sh') }}
      - name: Provision tools and Qt 6.4
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build qt6-base-dev qt6-declarative-dev qt6-multimedia-dev \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-window qml6-module-qtqml-workerscript qml6-module-qtquick-templates \
            libgl-dev libgl1-mesa-dri libglx-mesa0 libegl1 libepoxy-dev xvfb libavcodec-dev libswscale-dev libopus-dev \
            qt6-websockets-dev libssl-dev pkg-config
      - name: Bootstrap vcpkg
        run: scripts/bootstrap-vcpkg.sh
      - name: Check Player
        run: xvfb-run -a make check-client
      - name: Install Go for Hub E2E
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: E2E Player CLI against Hub
        # The E2E script builds the Hub and framebeam-sign itself (go build), no extra build step needed.
        run: |
          scripts/e2e-player-hub.sh
          scripts/e2e-session.sh

  client-windows:
    name: Player (C++, Windows MSVC)
    # ADR 0008: PRs, manual runs, pushes to main (cache priming and test releases) and release tags.
    # Also skipped for docs-only changes (see job changes).
    if: needs.changes.outputs.docs_only != 'true' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))))
    needs: [version, changes]
    runs-on: windows-latest
    timeout-minutes: 300
    env:
      FRAMEBEAM_VERSION: ${{ needs.version.outputs.version }}
      FRAMEBEAM_CHANNEL: ${{ needs.version.outputs.channel }}
      FRAMEBEAM_COMMIT: ${{ needs.version.outputs.commit }}
      VCPKG_ROOT: ${{ github.workspace }}\.vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-binary-cache
    steps:
      - uses: actions/checkout@v4
      - name: Cache vcpkg checkout
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}
          key: vcpkg-root-${{ runner.os }}-${{ hashFiles('client/vcpkg.json') }}
      - name: Bootstrap vcpkg at baseline commit
        shell: pwsh
        run: |
          # Own checkout instead of VCPKG_INSTALLATION_ROOT: the runner's copy is
          # not pinned to builtin-baseline and its version database may be missing.
          $baseline = (Get-Content client/vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          if (-not (Test-Path "$env:VCPKG_ROOT/vcpkg.exe")) {
            New-Item -ItemType Directory -Force $env:VCPKG_ROOT | Out-Null
            git -C $env:VCPKG_ROOT init -q
            git -C $env:VCPKG_ROOT remote add origin https://github.com/microsoft/vcpkg
            git -C $env:VCPKG_ROOT fetch -q --depth 1 origin $baseline
            git -C $env:VCPKG_ROOT checkout -q --force $baseline
            & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
            if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed" }
          }
      - name: Cache melonDS DS core
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\.framebeam-cache\cores
          key: melondsds-core-windows-${{ hashFiles('scripts/melonds-ds.pin', 'scripts/fetch-melonds-ds.ps1') }}
      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.*
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia qtwebsockets
          cache: true
      - name: Provision melonDS DS core
        id: core
        shell: pwsh
        env:
          FRAMEBEAM_CACHE_DIR: ${{ github.workspace }}\.framebeam-cache
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $dll = scripts/fetch-melonds-ds.ps1 | Select-Object -Last 1
          "dll=$dll" >> $env:GITHUB_OUTPUT
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Identify vcpkg cache toolchain
        id: vcpkg-toolchain
        shell: pwsh
        run: |
          $version = (Get-Item (Get-Command cl.exe).Source).VersionInfo.ProductVersion
          if (-not $version) { throw "MSVC compiler version is missing" }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Restore vcpkg binary cache
        id: vcpkg-binary-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          # A unique key lets each configure save additional ABI entries after a partial restore.
          key: vcpkg-bin-${{ runner.os }}-x64-windows-release-msvc-${{ steps.vcpkg-toolchain.outputs.version }}-${{ hashFiles('client/vcpkg.json', 'client/CMakePresets.json', 'client/triplets/*.cmake') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-bin-${{ runner.os }}-x64-windows-release-msvc-${{ steps.vcpkg-toolchain.outputs.version }}-${{ hashFiles('client/vcpkg.json', 'client/CMakePresets.json', 'client/triplets/*.cmake') }}-
            vcpkg-bin-${{ runner.os }}-x64-windows-release-msvc-${{ steps.vcpkg-toolchain.outputs.version }}-
      - name: Configure
        working-directory: client
        run: cmake --preset windows-msvc-release "-DFRAMEBEAM_MELONDS_DS_CORE=${{ steps.core.outputs.dll }}" "-DFRAMEBEAM_VERSION=$env:FRAMEBEAM_VERSION" "-DFRAMEBEAM_CHANNEL=$env:FRAMEBEAM_CHANNEL" "-DFRAMEBEAM_COMMIT=$env:FRAMEBEAM_COMMIT"
      # Save the binary cache right after vcpkg install (part of configure), even if
      # later steps fail, so a long FFmpeg build is never repeated.
      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-binary-cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg-binary-cache.outputs.cache-primary-key }}
      - name: Build
        working-directory: client
        run: cmake --build --preset windows-msvc-release
      - name: Test
        working-directory: client
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          # Tests also write their QtTest log here, so an intermittent failure shows its assertion from the first run.
          FRAMEBEAM_TEST_LOG_DIR: ${{ github.workspace }}\testlogs
        run: |
          # The core is always present in CI: skipped tests (e.g. emulation_core) count as failures.
          ctest --preset windows-msvc-release 2>&1 | Tee-Object -FilePath ctest.log
          if ($LASTEXITCODE -ne 0) {
            # Re-run every failed test exe directly: QtTest output goes to a file (survives a crash) and to the
            # console, followed by the files and the exit code (0xC0000005 = access violation, 3/4 = abort/terminate).
            $failed = Select-String -Path ctest.log -Pattern '^\s*\d+/\d+ Test\s+#\d+: (\S+) \.+\*{3}(Failed|Exception|Timeout)' |
              ForEach-Object { $_.Matches[0].Groups[1].Value } | Sort-Object -Unique
            foreach ($t in $failed) {
              $first = Join-Path $env:FRAMEBEAM_TEST_LOG_DIR "test_$t.txt"
              if (Test-Path $first) {
                Write-Host "::group::first run of $t ($first)"
                Select-String -Path $first -Pattern 'FAIL!|QFATAL' -Context 3,3 | Out-Host
                Get-Content $first | Select-Object -Last 60 | Out-Host
                Write-Host "::endgroup::"
              }
              $exe = Get-ChildItem -Recurse -Filter "test_$t.exe" | Select-Object -First 1
              if (-not $exe) { Write-Host "::warning::no exe for $t"; continue }
              Write-Host "::group::rerun $t ($($exe.FullName))"
              # Same environment as under ctest (core path, test ROM, offscreen): read from the test properties.
              $props = (ctest --preset windows-msvc-release -R "^$t$" --show-only=json-v1 | ConvertFrom-Json).tests[0].properties
              foreach ($kv in (($props | Where-Object { $_.name -eq 'ENVIRONMENT' }).value)) {
                $k, $v = $kv -split '=', 2
                Set-Item -Path "env:$k" -Value $v
              }
              Push-Location $exe.DirectoryName
              # Two -o: file (survives a crash) AND stdout. "$t.txt,txt" is one argument "<file>,<format>".
              $txt = Join-Path $exe.DirectoryName "$t.txt"
              Remove-Item $txt -ErrorAction SilentlyContinue
              $out = & $exe.FullName -v2 -maxwarnings 0 -o "${txt},txt" -o "-,txt" 2>&1 | ForEach-Object { "$_" }
              $code = $LASTEXITCODE
              Pop-Location
              Write-Host "exit code of ${t}: $code (0x$('{0:X}' -f $code))"
              # QtTest result file, unfiltered tail, then the interesting lines of it (and of the console output).
              if (Test-Path $txt) {
                Write-Host "--- $t.txt (last 80 lines) ---"
                Get-Content $txt | Select-Object -Last 80 | Out-Host
                Write-Host "--- FAIL!/QWARN/QFATAL in $t.txt ---"
                Select-String -Path $txt -Pattern 'FAIL!|QWARN|QFATAL' -Context 3,3 | Out-Host
              } else {
                Write-Host "::warning::$txt was not written"
              }
              Write-Host "--- console: guard lines, [loopback] and failures ---"
              $out | Select-String -Pattern 'FAIL!|QFATAL|Totals|\[fbtest\]|\[uitest\]|\[loopback\]' | Out-Host
              Write-Host "::endgroup::"
            }
            throw "ctest failed"
          }
          # GL tests may skip here (no GL 3.3 context, ADR 0013 D6); any other skip is an error.
          $skipped = @(Select-String -Path ctest.log -Pattern '\(Skipped\)|\*\*\*Skipped' | ForEach-Object { $_.Line })
          if (@($skipped | Where-Object { $_ -notmatch '\b(emulation_hw_render|emulation_core_gl)\b' }).Count -gt 0) { throw "Tests were skipped although the core should be present" }
          if ($skipped.Count -gt 0) { Write-Host "Note: GL tests skipped (no GL 3.3 context on this runner), allowed by ADR 0013 D6" }
      - name: Assemble package (windeployqt)
        shell: pwsh
        run: |
          # Layout (spec 0.3 S6): the tiny launcher and the notice at the top, everything else in bin\.
          $dist = "$env:GITHUB_WORKSPACE\dist\framebeam-player"
          $bin = "$dist\bin"
          New-Item -ItemType Directory -Force $bin | Out-Null
          # The launcher (target framebeam_player_launcher) is built to <build>\launcher\framebeam_player.exe; the real Player
          # is the only other framebeam_player.exe in the build tree.
          $build = "client\build\windows-msvc-release"
          $launcher = Get-Item "$build\launcher\framebeam_player.exe" -ErrorAction SilentlyContinue
          if (-not $launcher) { throw "launcher not found: $build\launcher\framebeam_player.exe" }
          $launcherDir = (Resolve-Path "$build\launcher").Path
          $reals = @(Get-ChildItem -Recurse -Filter framebeam_player.exe $build | Where-Object { -not $_.DirectoryName.StartsWith($launcherDir, [StringComparison]::OrdinalIgnoreCase) })
          if ($reals.Count -ne 1) { throw "expected exactly one real framebeam_player.exe outside launcher\, found $($reals.Count): $($reals.FullName -join ', ')" }
          $real = $reals[0]
          if ($launcher.Length -ge $real.Length) { throw "launcher ($($launcher.Length) bytes) is not smaller than the Player ($($real.Length) bytes)" }
          Write-Host "Launcher: $($launcher.FullName)"
          Write-Host "Player:   $($real.FullName)"
          Copy-Item $launcher.FullName "$dist\framebeam_player.exe"
          Copy-Item $real.FullName "$bin\framebeam_player.exe"
          # vcpkg runtime DLLs (libdatachannel, FFmpeg, OpenH264, Opus, SDL3 and their transitive DLLs): windeployqt only
          # deploys Qt. vcpkg's applocal step puts them next to the exe; fall back to the release bin directory of
          # the manifest install (never debug\bin). Qt DLLs are left to windeployqt.
          $sources = @($real.DirectoryName)
          $installed = @(Get-ChildItem -Recurse -Directory -Filter 'vcpkg_installed' client\build\windows-msvc-release -ErrorAction SilentlyContinue |
            ForEach-Object { Join-Path $_.FullName 'x64-windows-release\bin' } | Where-Object { Test-Path $_ })
          $sources += $installed
          foreach ($src in ($sources | Select-Object -Unique)) {
            foreach ($f in (Get-ChildItem -Path $src -Filter *.dll -File)) {
              if ($f.Name -like 'Qt6*.dll') { continue }
              if (-not (Test-Path "$bin\$($f.Name)")) { Copy-Item $f.FullName $bin }
            }
          }
          Write-Host "Bundled non-Qt DLLs: $((Get-ChildItem $bin -Filter *.dll | ForEach-Object Name) -join ', ')"
          foreach ($need in 'datachannel', 'avutil', 'avcodec', 'swscale', 'opus', 'SDL3') {
            if (-not (Get-ChildItem $bin -Filter "*$need*.dll")) { throw "Runtime DLL matching *$need*.dll is missing from the package" }
          }
          windeployqt --release --no-translations --qmldir client\ui "$bin\framebeam_player.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }
          if (Get-ChildItem $dist -Filter *.dll) { throw "DLLs at the top level of the package: only the launcher belongs there" }
          # No emulator cores in the package: the Player downloads them from the FrameBeam Hub on demand.
          @"
          This package contains no emulator cores. Emulator cores (e.g. melonDS DS, GPL-3.0) are
          downloaded from your FrameBeam Hub when needed; the Hub provides each core together with its
          licence text and source link.
          Contains no ROMs, BIOS or firmware.

          Further bundled libraries (built via vcpkg, see client/vcpkg.json):
          - FFmpeg (avcodec, avutil, swscale), LGPL-2.1-or-later, https://ffmpeg.org/ (source: https://git.ffmpeg.org/ffmpeg.git)
          - OpenH264, BSD-2-Clause, https://github.com/cisco/openh264
          - libdatachannel, MPL-2.0, https://github.com/paullouisageneau/libdatachannel
          - libjuice, MPL-2.0, https://github.com/paullouisageneau/libjuice
          - libsrtp, BSD-3-Clause, https://github.com/cisco/libsrtp
          - usrsctp, BSD-3-Clause, https://github.com/sctplab/usrsctp
          - Opus, BSD-3-Clause, https://opus-codec.org/ (source: https://gitlab.xiph.org/xiph/opus)
          - SDL3 (gamepad input only), zlib, https://libsdl.org/ (source: https://github.com/libsdl-org/SDL)
          - OpenSSL, Apache-2.0, https://www.openssl.org/
          - Qt 6 (LGPL-3.0, dynamically linked), https://www.qt.io/
          The FFmpeg and Qt DLLs are shared libraries and can be replaced by compatible builds.
          "@ | Set-Content "$dist\THIRD-PARTY-NOTICE.txt"
      - name: Package smoke check
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $dist = "$env:GITHUB_WORKSPACE\dist\framebeam-player"
          $bin = "$dist\bin"
          $launcher = "$dist\framebeam_player.exe"
          # 1) Static: every non-system import of the executables and of the bundled DLLs must be in the package.
          $dumpbin = Get-Command dumpbin.exe -ErrorAction SilentlyContinue
          if ($dumpbin) {
            $missing = @()
            foreach ($bin1 in (@($launcher, "$bin\framebeam_player.exe") + (Get-ChildItem $bin -Filter *.dll | ForEach-Object FullName))) {
              $dir = [IO.Path]::GetDirectoryName($bin1)
              foreach ($line in (& $dumpbin.Source /dependents $bin1)) {
                if ($line -match '^\s+(\S+\.dll)\s*$') {
                  $d = $Matches[1]
                  if ($d -match '^(api-ms-win-|ext-ms-win-)' -or (Test-Path "$dir\$d") -or (Test-Path "$env:SystemRoot\System32\$d")) { continue }
                  $missing += "$([IO.Path]::GetFileName($bin1)) -> $d"
                }
              }
            }
            $missing = $missing | Sort-Object -Unique
            if ($missing) { $missing | ForEach-Object { Write-Host "::error::missing dependency: $_" }; throw "Package is missing DLLs" }
            Write-Host "dumpbin: all non-system dependencies are in the package"
          } else {
            Write-Host "::warning::dumpbin not available, skipping static dependency check"
          }
          # 2) Dynamic, through the top-level launcher (as users start it): --version needs no window and no Hub; the
          # loader fails before main() when a DLL is missing. --smoke-test additionally loads the QML UI (offscreen).
          foreach ($argSet in @(@('--version'), @('--smoke-test'))) {
            $p = Start-Process -FilePath $launcher -ArgumentList $argSet -WorkingDirectory $dist -PassThru -NoNewWindow
            $null = $p.Handle  # cache the handle, otherwise ExitCode can be empty
            if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "$argSet did not exit within 60 s" }
            $code = $p.ExitCode
            Write-Host "framebeam_player.exe $argSet exit code: $code (0x$('{0:X8}' -f $code))"
            if ($code -eq -1073741515 -or $code -eq 3221225781) {
              throw "STATUS_DLL_NOT_FOUND (0xC0000135): a runtime DLL is missing from the package"
            }
            if ($code -ne 0) { throw "framebeam_player.exe $argSet failed with exit code $code" }
          }
          # 3) Release info: --version-json with redirected stdout (the launcher passes its handles on).
          $out = "$env:GITHUB_WORKSPACE\dist\zip\player-release-info.json"
          New-Item -ItemType Directory -Force (Split-Path $out) | Out-Null
          $err = "$env:RUNNER_TEMP\version-json.err"
          $p = Start-Process -FilePath $launcher -ArgumentList '--version-json' -WorkingDirectory $dist -PassThru -NoNewWindow `
            -RedirectStandardOutput $out -RedirectStandardError $err
          $null = $p.Handle
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "--version-json did not exit within 60 s" }
          if ($p.ExitCode -ne 0) { throw "--version-json failed with exit code $($p.ExitCode)" }
          Get-Content $out | Write-Host
          $info = Get-Content $out -Raw | ConvertFrom-Json
          if ($info.product -ne 'player') { throw "release info: product is '$($info.product)'" }
          if ($info.version -ne $env:FRAMEBEAM_VERSION) { throw "release info: version '$($info.version)' != $env:FRAMEBEAM_VERSION" }
          if ($info.channel -ne $env:FRAMEBEAM_CHANNEL) { throw "release info: channel '$($info.channel)' != $env:FRAMEBEAM_CHANNEL" }
          # 4) Portable zip (one top-level folder).
          $zip = "$env:GITHUB_WORKSPACE\dist\zip\framebeam-player-$($env:FRAMEBEAM_VERSION)-windows-x64.zip"
          Compress-Archive -Path $dist -DestinationPath $zip -CompressionLevel Optimal
          Get-Item $zip | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: framebeam-player-windows-x64
          path: |
            dist/zip/framebeam-player-*-windows-x64.zip
            dist/zip/player-release-info.json
          if-no-files-found: error
          retention-days: 7
      - name: Build installer (Inno Setup)
        shell: pwsh
        env:
          CORE_VERSION: ${{ needs.version.outputs.core }}
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed" }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          # AppVersion = full SemVer; VersionInfoVersion must be numeric (x.y.z.build).
          $name = "framebeam-player-$($env:FRAMEBEAM_VERSION)-windows-x64-setup"
          & $iscc "/DAppVersion=$env:FRAMEBEAM_VERSION" "/DVersionInfoVersion=$env:CORE_VERSION.${{ github.run_number }}" `
            "/DOutputBaseName=$name" `
            "/DPackageDir=$env:GITHUB_WORKSPACE\dist\framebeam-player" "/DOutputDir=$env:GITHUB_WORKSPACE\dist\installer" `
            packaging\windows\framebeam-player.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          if (-not (Test-Path "dist\installer\$name.exe")) { throw "installer was not produced" }
      - name: Installer test (silent install, upgrade over the old flat layout)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $setup = (Get-ChildItem dist\installer\framebeam-player-*-windows-x64-setup.exe | Select-Object -First 1).FullName
          $dir = Join-Path $env:RUNNER_TEMP 'fb-install-test'
          $log = Join-Path $env:RUNNER_TEMP 'fb-setup.log'
          function Invoke-Setup {
            $p = Start-Process -FilePath $setup -PassThru -Wait -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$dir", "/LOG=$log")
            if ($p.ExitCode -ne 0) { Get-Content $log -Tail 40 | Write-Host; throw "setup exited with $($p.ExitCode)" }
          }
          Invoke-Setup
          foreach ($f in 'framebeam_player.exe', 'bin\framebeam_player.exe', 'THIRD-PARTY-NOTICE.txt', 'unins000.exe') {
            if (-not (Test-Path "$dir\$f")) { throw "after the first install: $f is missing" }
          }
          # An old (flat) install: DLLs and Qt directories next to the exe, plus user data.
          New-Item -ItemType Directory -Force "$dir\platforms", "$dir\qml\QtQuick", "$dir\data" | Out-Null
          Set-Content "$dir\Qt6Core.dll", "$dir\avcodec-61.dll", "$dir\platforms\qwindows.dll", "$dir\qml\QtQuick\qmldir" -Value 'old'
          Set-Content "$dir\data\marker" -Value 'keep-me'
          Invoke-Setup
          foreach ($gone in 'Qt6Core.dll', 'avcodec-61.dll', 'platforms', 'qml') {
            if (Test-Path "$dir\$gone") { throw "old layout item survived the upgrade: $gone" }
          }
          if ((Get-Content "$dir\data\marker" -Raw).Trim() -ne 'keep-me') { throw "data\marker was changed or removed" }
          if (-not (Test-Path "$dir\bin\framebeam_player.exe")) { throw "bin\framebeam_player.exe is missing after the upgrade" }
          $p = Start-Process -FilePath "$dir\framebeam_player.exe" -ArgumentList '--version' -WorkingDirectory $dir -PassThru -NoNewWindow
          $null = $p.Handle
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "installed launcher --version did not exit within 60 s" }
          if ($p.ExitCode -ne 0) { throw "installed launcher --version exited with $($p.ExitCode)" }
          $u = Start-Process -FilePath "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -PassThru -Wait
          Write-Host "uninstall exit code: $($u.ExitCode)"
      - uses: actions/upload-artifact@v4
        with:
          name: framebeam-player-windows-x64-setup
          path: dist/installer/framebeam-player-*-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 7
