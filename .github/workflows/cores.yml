name: Cores release

# Builds the pinned emulator core(s), publishes them as GitHub release assets and updates the signed index
# (release "cores-index") that FrameBeam Hubs read. The signing seed is the repository secret
# FRAMEBEAM_SIGNING_KEY (base64 Ed25519 seed); it is only ever passed through the environment of the steps that
# need it and is never written to a file or printed. See docs/architecture and the 0.2 core design.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/melonds-ds.pin
  # Pre-merge check only (workflow_dispatch needs the workflow on main): no builds, no releases.
  pull_request:
    paths:
      - .github/workflows/cores.yml
      - scripts/check-core-signing-key.sh
      - server/internal/corepkg/**
      - server/cmd/framebeam-sign/**

permissions:
  contents: read

# One index update at a time: the publish job does read-modify-write on the index release.
concurrency:
  group: cores-release
  cancel-in-progress: false

jobs:
  preflight:
    name: Check signing secret
    runs-on: ubuntu-latest
    env:
      FRAMEBEAM_SIGNING_KEY: ${{ secrets.FRAMEBEAM_SIGNING_KEY }}
    steps:
      - name: Require FRAMEBEAM_SIGNING_KEY
        run: |
          if [ -z "$FRAMEBEAM_SIGNING_KEY" ]; then
            echo "::error title=Signing key missing::Repository secret FRAMEBEAM_SIGNING_KEY is empty or not set. Generate a key with 'framebeam-sign keygen', store the seed as that secret and put the public key into server/internal/corepkg/keys.go."
            exit 1
          fi

  # Pull requests: the signing secret must match a key compiled into the Hub and sign/verify a throwaway index.
  check-signing-key:
    name: Check signing key
    if: github.event_name == 'pull_request'
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build framebeam-sign
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          (cd server && CGO_ENABLED=0 go build -o "$RUNNER_TEMP/bin/framebeam-sign" ./cmd/framebeam-sign)
      - name: Signing key is trusted by the Hub and signs
        env:
          FRAMEBEAM_SIGNING_KEY: ${{ secrets.FRAMEBEAM_SIGNING_KEY }}
        run: scripts/check-core-signing-key.sh "$RUNNER_TEMP/bin/framebeam-sign"

  build-linux-x64:
    name: melonDS DS (linux-x64)
    if: github.event_name != 'pull_request'
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache melonDS DS core
        uses: actions/cache@v4
        with:
          path: ~/.cache/framebeam/cores
          key: melondsds-core-linux-${{ hashFiles('scripts/melonds-ds.pin', 'scripts/fetch-melonds-ds.sh') }}
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build cmake pkg-config libgl-dev libepoxy-dev
      - name: Build core
        run: |
          [ "$(uname -m)" = "x86_64" ] || { echo "::error::expected an x86_64 runner"; exit 1; }
          so="$(scripts/fetch-melonds-ds.sh | tail -n 1)"
          [ -f "$so" ] || { echo "::error::core library not found"; exit 1; }
          [ -f "$(dirname "$so")/LICENSE-melonDS-DS.txt" ] || { echo "::error::license file not found"; exit 1; }
          mkdir -p stage
          cp "$so" "$(dirname "$so")/LICENSE-melonDS-DS.txt" stage/
          ls -l stage
      - uses: actions/upload-artifact@v4
        with:
          name: core-melonds_ds-linux-x64
          path: stage
          if-no-files-found: error
          retention-days: 3

  build-windows-x64:
    name: melonDS DS (windows-x64)
    if: github.event_name != 'pull_request'
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache melonDS DS core
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\.framebeam-cache\cores
          key: melondsds-core-windows-${{ hashFiles('scripts/melonds-ds.pin', 'scripts/fetch-melonds-ds.ps1') }}
      - name: Fetch core (upstream release asset, pinned SHA-256)
        shell: pwsh
        env:
          FRAMEBEAM_CACHE_DIR: ${{ github.workspace }}\.framebeam-cache
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $dll = scripts/fetch-melonds-ds.ps1 | Select-Object -Last 1
          if (-not (Test-Path $dll)) { throw "core library not found: $dll" }
          $lic = Join-Path (Split-Path $dll) 'LICENSE-melonDS-DS.txt'
          if (-not (Test-Path $lic)) { throw "license file not found: $lic" }
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item $dll, $lic stage
          Get-ChildItem stage | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: core-melonds_ds-windows-x64
          path: stage
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish and sign index
    if: github.event_name != 'pull_request'
    needs: [preflight, build-linux-x64, build-windows-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build framebeam-sign
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          (cd server && CGO_ENABLED=0 go build -o "$RUNNER_TEMP/bin/framebeam-sign" ./cmd/framebeam-sign)
      - name: Signing key is trusted by the Hub (before anything is published)
        env:
          FRAMEBEAM_SIGNING_KEY: ${{ secrets.FRAMEBEAM_SIGNING_KEY }}
        run: scripts/check-core-signing-key.sh "$RUNNER_TEMP/bin/framebeam-sign"
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/artifacts
      - name: Create or reuse the core release and upload assets
        run: |
          set -euo pipefail
          . scripts/melonds-ds.pin
          version="${MELONDS_DS_TAG#v}"
          tag="core-melonds_ds-$version"
          echo "CORE_VERSION=$version" >> "$GITHUB_ENV"
          echo "CORE_TAG=$tag" >> "$GITHUB_ENV"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "melonDS DS $version (FrameBeam core package)" \
              --notes "Emulator core melonDS DS $version (GPL-3.0, https://github.com/JesseTG/melonds-ds, ref $MELONDS_DS_TAG $MELONDS_DS_COMMIT). Packages are referenced by the signed index in release cores-index; do not use these files directly." \
              --latest=false
          fi
          assets="$RUNNER_TEMP/assets"
          mkdir -p "$assets"
          for platform in linux-x64 windows-x64; do
            dir="$RUNNER_TEMP/artifacts/core-melonds_ds-$platform"
            [ -d "$dir" ] || { echo "::error::artifact for $platform missing"; exit 1; }
            for f in "$dir"/*; do
              cp "$f" "$assets/melonds_ds-$version-$platform-$(basename "$f")"
            done
          done
          ls -l "$assets"
          gh release upload "$tag" "$assets"/* --clobber
      - name: Build package entries
        run: |
          set -euo pipefail
          . scripts/melonds-ds.pin
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$CORE_TAG"
          pkgs="$RUNNER_TEMP/packages"
          mkdir -p "$pkgs"
          for platform in linux-x64 windows-x64; do
            case "$platform" in
              linux-x64)   lib=melondsds_libretro.so;  origin="built from source (scripts/fetch-melonds-ds.sh) in GitHub Actions" ;;
              windows-x64) lib=melondsds_libretro.dll; origin="upstream release asset $MELONDS_DS_WIN_ASSET (SHA-256 pinned)" ;;
            esac
            dir="$RUNNER_TEMP/artifacts/core-melonds_ds-$platform"
            files='[]'
            for entry in "$lib:library" "LICENSE-melonDS-DS.txt:license"; do
              name="${entry%%:*}"; role="${entry##*:}"
              f="$dir/$name"
              [ -f "$f" ] || { echo "::error::$name missing for $platform"; exit 1; }
              asset="melonds_ds-$CORE_VERSION-$platform-$name"
              files="$(jq -c --arg name "$name" --arg role "$role" --argjson size "$(stat -c %s "$f")" \
                --arg sha "$(sha256sum "$f" | cut -d' ' -f1)" --arg url "$base/$asset" \
                '. + [{name:$name, role:$role, size:$size, sha256:$sha, url:$url}]' <<<"$files")"
            done
            jq -n --arg platform "$platform" --arg version "$CORE_VERSION" --arg origin "$origin" \
              --arg ref "$MELONDS_DS_TAG $MELONDS_DS_COMMIT" --argjson files "$files" \
              '{core_id:"melonds_ds", version:$version, platform:$platform, license:"GPL-3.0",
                source_url:"https://github.com/JesseTG/melonds-ds", source_ref:$ref, origin:$origin, files:$files}' \
              > "$pkgs/$platform.json"
          done
      - name: Merge, sign and verify the index
        env:
          # The seed exists only in the environment of this step; it is never echoed or written to disk.
          FRAMEBEAM_SIGNING_KEY: ${{ secrets.FRAMEBEAM_SIGNING_KEY }}
        run: |
          set -euo pipefail
          [ -n "$FRAMEBEAM_SIGNING_KEY" ] || { echo "::error title=Signing key missing::FRAMEBEAM_SIGNING_KEY is empty"; exit 1; }
          sign="$RUNNER_TEMP/bin/framebeam-sign"
          idx="$RUNNER_TEMP/index"
          mkdir -p "$idx"
          if gh release view cores-index >/dev/null 2>&1; then
            # Absent index asset (release exists but is empty) is fine: a new index is created by "add".
            gh release download cores-index --pattern cores-index.json --dir "$idx" || true
          fi
          for platform in linux-x64 windows-x64; do
            "$sign" add -index "$idx/cores-index.json" -package "$RUNNER_TEMP/packages/$platform.json"
          done
          "$sign" sign -index "$idx/cores-index.json" -out "$idx/cores-index.json.sig"
          pub="$("$sign" pubkey | sed -n 's/^public_key=//p' | head -n 1)"
          [ -n "$pub" ] || { echo "::error::could not derive the public key"; exit 1; }
          "$sign" verify -index "$idx/cores-index.json" -sig "$idx/cores-index.json.sig" -pub "$pub"
          # Same check as the Hub: the key must be one of the compiled-in trusted keys.
          grep -qF "\"$pub\"" server/internal/corepkg/keys.go || { echo "::error::signing key is not in DefaultTrustedKeys"; exit 1; }
          jq -r '.packages[] | "\(.core_id) \(.version) \(.platform)"' "$idx/cores-index.json"
      - name: Upload the index (release cores-index)
        run: |
          set -euo pipefail
          idx="$RUNNER_TEMP/index"
          if ! gh release view cores-index >/dev/null 2>&1; then
            gh release create cores-index --title "FrameBeam core index" \
              --notes "Signed index of FrameBeam core packages (cores-index.json + .sig). Read by FrameBeam Hubs; updated by the cores workflow." \
              --latest=false
          fi
          gh release upload cores-index "$idx/cores-index.json" "$idx/cores-index.json.sig" --clobber
