  responses:
    AdminBackupConflict:
      description: A backup or restore is already running (`conflict`), or there is nothing to cancel
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            default: { value: { error: { code: conflict, message: A backup or restore is already running } } }
    AdminUpdateConflict:
      description: Going back needs a confirmation or is refused, or updates are not paused (`conflict`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            default: { value: { error: { code: conflict, message: Going back replaces the database with the backup made before the update; confirm to go on } } }
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            default: { value: { error: { code: bad_request, message: Invalid request } } }
    Unauthorized:
      description: Not authenticated (`unauthorized`), or the owning user was disabled by an admin (`user_disabled`, any authenticated call)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            default: { value: { error: { code: unauthorized, message: Token missing or invalid } } }
            user_disabled: { value: { error: { code: user_disabled, message: User has been disabled } } }
    Forbidden:
      description: Not allowed (slot belongs to another user)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            default: { value: { error: { code: forbidden, message: Not allowed } } }
    UploadsDisabled:
      description: Uploads are disabled (admin setting) or the user no longer has the upload right (code `uploads_disabled`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            default: { value: { error: { code: uploads_disabled, message: Uploads are disabled for users } } }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            default: { value: { error: { code: not_found, message: Not found } } }
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            default: { value: { error: { code: rate_limited, message: Too many open requests } } }
    CorePackageNotFound:
      description: The server knows no such core package
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            default: { value: { error: { code: core_package_not_found, message: Core package not found } } }
    CoreFileNotAvailable:
      description: The file is not in the server cache (or unknown)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            default: { value: { error: { code: core_file_not_available, message: Core file not available } } }
    SessionNotFound:
      description: Session does not exist
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            default: { value: { error: { code: session_not_found, message: Session not found } } }
    SessionForbidden:
      description: Not allowed (ACL, or the call is reserved for the owner device or the invited user)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            default: { value: { error: { code: session_forbidden, message: Not allowed for this Session } } }
    SessionEnded:
      description: Session has ended
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            default: { value: { error: { code: session_ended, message: Session has ended } } }
    CapabilityMissing:
      description: Device lacks a required capability (H.264 encode)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            default: { value: { error: { code: capability_missing, message: Device cannot encode H.264 } } }
    RunConflict:
      description: 'Conflict: `run_not_active` (paused, finished or abandoned runs refuse writes), `conflict` (transition not allowed, event limit, already joined with another game)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            run_not_active: { value: { error: { code: run_not_active, message: The run is not active (paused, finished or abandoned) } } }
    TooLarge:
      description: |
        A JSON object is larger than its limit (settings 16 KiB, state 64 KiB, event payload 4 KiB, board 64 KiB), or
        any JSON request body exceeds the 1 MiB cap of the server (code `payload_too_large`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            default: { value: { error: { code: too_large, message: state is larger than 64 KiB } } }
            body_cap: { value: { error: { code: payload_too_large, message: Request too large } } }
    SessionFullOrCapability:
      description: Session full, or the device lacks H.264 decode
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            session_full: { value: { error: { code: session_full, message: Session already has 4 viewers } } }
            capability_missing: { value: { error: { code: capability_missing, message: Device cannot decode H.264 } } }
  schemas:
    ErrorCode:
      type: string
      description: "`save_not_snapshot` is no longer returned since `saves_v6` (any history version can be deleted)."
      enum: [bad_request, unauthorized, forbidden, not_found, conflict, rate_limited, internal, device_revoked, invalid_credentials, pairing_pending, pairing_denied, pairing_expired, player_too_old, hub_too_old, core_missing, core_version_mismatch, capability_missing, save_conflict, save_conflict_stale, save_not_snapshot, save_slot_exists, save_slot_protected, session_running, payload_too_large, session_not_found, session_forbidden, session_full, session_ended, invite_invalid, display_name_taken, user_disabled, uploads_disabled, core_package_not_found, core_file_not_available, import_dir_unreadable, run_not_active, state_conflict, too_large, confirmation_required, password_required, password_not_set]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string }
            retry_after: { type: integer, minimum: 1, description: 'Only on `rate_limited` when the next try is possible at a known time: seconds to wait (also sent as the `Retry-After` header)' }
    HubInfo:
      type: object
      required: [hub_id, name, hub_version, protocol_version, min_protocol_version, api_base]
      properties:
        hub_id: { type: string, format: uuid }
        name: { type: string }
        hub_version: { type: string }
        protocol_version: { type: integer, minimum: 1 }
        min_protocol_version: { type: integer, minimum: 1 }
        api_base: { type: string, example: /api/v1 }
    PairingRequestCreate:
      type: object
      required: [device_id, device_name, platform, arch, player_version, protocol_version]
      properties:
        device_id: { type: string, format: uuid }
        device_name: { type: string }
        platform: { type: string }
        arch: { type: string }
        player_version: { type: string }
        protocol_version: { type: integer, minimum: 1 }
        install_id: { type: string, maxLength: 64, description: Optional. Groups the device rows of one app install (several users on one PC) }
    PairingRequestAccepted:
      type: object
      required: [request_id, poll_token, status, expires_in]
      properties:
        request_id: { type: string, format: uuid }
        poll_token: { type: string, description: 'Prefix fbp_' }
        status: { type: string, enum: [pending] }
        expires_in: { type: integer, description: Seconds, example: 600 }
    PairingStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [pending, approved, denied, expired] }
        hub_id: { type: string, format: uuid, description: Only when approved (once) }
        user_id: { type: string, description: Server-local user ID; only when approved }
        device_credential: { type: string, description: 'Prefix fbd_; only when approved, once' }
    AdminMetrics:
      type: object
      required: [enabled, token_set]
      properties:
        enabled: { type: boolean }
        token_set: { type: boolean, description: A token exists (only its hash is stored) }
        token: { type: string, description: 'Prefix fbm_; present once, when switching on created the token' }
    AdminMetricsUpdate:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    AdminMetricsToken:
      type: object
      required: [token]
      properties:
        token: { type: string, description: 'Prefix fbm_; shown once' }
    ReportMeta:
      type: object
      required: [description]
      properties:
        description: { type: string, minLength: 1, maxLength: 8000, description: 'What happened, in the user''s words' }
        linked_event:
          type: object
          description: The event the report is about (for example the error banner the user came from)
          required: [title]
          properties:
            title: { type: string, maxLength: 200 }
            time: { type: string, format: date-time }
        player_version: { type: string, maxLength: 64 }
        os: { type: string, maxLength: 120, description: 'For example `Windows 11`' }
    ReportCreated:
      type: object
      required: [id]
      properties:
        id: { type: integer, format: int64, description: 'Report number shown as `#12`' }
    AdminReportFile:
      type: object
      required: [name, size]
      properties:
        name: { type: string }
        size: { type: integer, format: int64 }
    AdminReportSummary:
      type: object
      required: [id, status, title, user, device, created_at, size, file_count]
      properties:
        id: { type: integer, format: int64 }
        status: { type: string, enum: [new, seen] }
        title: { type: string, description: 'First line of the description' }
        user: { type: string }
        device: { type: string }
        player_version: { type: string }
        os: { type: string }
        linked_event_title: { type: string }
        has_connection_check: { type: boolean }
        created_at: { type: string, format: date-time }
        size: { type: integer, format: int64, description: Bytes of all attachments }
        file_count: { type: integer }
    AdminReport:
      allOf:
        - $ref: '#/components/schemas/AdminReportSummary'
        - type: object
          required: [description, files]
          properties:
            description: { type: string }
            linked_event_time: { type: string, format: date-time }
            seen_at: { type: string, format: date-time }
            files:
              type: array
              items: { $ref: '#/components/schemas/AdminReportFile' }
    AdminReportList:
      type: object
      required: [reports, count_all, count_new, count_seen]
      properties:
        reports:
          type: array
          items: { $ref: '#/components/schemas/AdminReportSummary' }
        count_all: { type: integer }
        count_new: { type: integer }
        count_seen: { type: integer }
    AdminProblem:
      type: object
      required: [id, title, detail, severity]
      properties:
        id: { type: string, description: 'Stable id such as `disk`, `turn`, `update`' }
        title: { type: string, description: 'Short text, for example `Disk 92 %`' }
        detail: { type: string }
        severity: { type: string, enum: [warn, error] }
        action_label: { type: string, description: 'Label of the suggested action, empty when none' }
        action_href: { type: string, description: 'Web interface path of the action; informational for apps' }
    AdminStatusSession:
      type: object
      required: [game_title, owner, device_name, visibility, started_at, viewers]
      properties:
        game_title: { type: string }
        owner: { type: string, description: Display name of the owner user }
        device_name: { type: string }
        visibility: { type: string, enum: [private, hub_users, invite_only] }
        started_at: { type: string, format: date-time }
        viewers: { type: integer }
    AdminStatusPlayer:
      type: object
      required: [device_name, user, version, state, outdated]
      properties:
        device_name: { type: string }
        user: { type: string }
        version: { type: string, description: App version }
        state: { type: string, enum: [in_session, watching, playing, idle] }
        outdated: { type: boolean, description: The app version is below the server version }
    AdminStatusError:
      type: object
      required: [time, level, message]
      properties:
        time: { type: string, format: date-time }
        level: { type: string, enum: [warn, error] }
        message: { type: string, description: Redacted }
    AdminStatusBackupDisk:
      type: object
      description: The volume holding the backup folder; absent when no backup folder is set. Sizes are absent where the platform has no reader.
      required: [folder]
      properties:
        folder: { type: string }
        total_bytes: { type: integer, format: int64 }
        free_bytes: { type: integer, format: int64 }
    AdminStatus:
      type: object
      required: [hub_name, hub_version, uptime_seconds, public_address, time, problems, memory, sessions, viewers, players, errors, metrics_enabled]
      properties:
        hub_name: { type: string }
        hub_version: { type: string }
        uptime_seconds: { type: integer, format: int64 }
        public_address: { type: string, description: 'host:port apps use; the host of the request when no public host is set' }
        time: { type: string, format: date-time, description: When the data was read }
        problems:
          type: array
          description: Open problems, the most urgent first (empty when all is well)
          items: { $ref: '#/components/schemas/AdminProblem' }
        cpu_percent: { type: number, description: 'Machine-wide CPU load 0 to 100; absent where the platform has no reader' }
        memory:
          type: object
          required: [process_bytes]
          properties:
            process_bytes: { type: integer, format: int64, description: Memory the server process holds }
            system_total_bytes: { type: integer, format: int64, description: Absent where the platform has no reader }
            system_used_bytes: { type: integer, format: int64 }
        disk:
          type: object
          description: The volume holding the data directory; absent where the platform has no reader
          required: [total_bytes, free_bytes]
          properties:
            total_bytes: { type: integer, format: int64 }
            free_bytes: { type: integer, format: int64 }
        backup_disk:
          $ref: '#/components/schemas/AdminStatusBackupDisk'
        sessions:
          type: array
          items: { $ref: '#/components/schemas/AdminStatusSession' }
        viewers: { type: integer, description: Viewers over all Sessions }
        turn:
          type: object
          description: The built-in TURN relay; absent when it is off
          required: [allocations, relay_ports]
          properties:
            allocations: { type: integer }
            relay_ports: { type: integer, description: Size of the relay port range }
        players:
          type: array
          items: { $ref: '#/components/schemas/AdminStatusPlayer' }
        errors:
          type: array
          description: Warnings and errors of the last 24 hours, newest first
          items: { $ref: '#/components/schemas/AdminStatusError' }
        metrics_enabled: { type: boolean }
    LocalStatus:
      type: object
      required: [admin_exists, network_sharing, import_dir, hub_version]
      properties:
        admin_exists: { type: boolean }
        network_sharing: { type: boolean, description: 'false = the server listens on loopback only and the built-in TURN relay is off' }
        import_dir: { type: string, description: Library import folder }
        hub_version: { type: string }
    LocalPairRequest:
      type: object
      required: [username, password, device_name, device_id, platform, arch, player_version, protocol_version]
      properties:
        username: { type: string }
        password: { type: string }
        device_name: { type: string }
        device_id: { type: string, format: uuid }
        platform: { type: string }
        arch: { type: string }
        player_version: { type: string }
        protocol_version: { type: integer, minimum: 1 }
    LocalSettingsUpdate:
      type: object
      properties:
        network_sharing: { type: boolean }
        import_dir: { type: string, description: Absolute path of an existing directory the server can read }
    TokenRequest:
      type: object
      required: [device_id, device_credential]
      properties:
        device_id: { type: string, format: uuid }
        device_credential: { type: string }
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string, description: 'Prefix fba_' }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, description: Seconds, example: 900 }
    InviteRedeemRequest:
      type: object
      required: [code, display_name, device_id, device_name, platform, arch, player_version, protocol_version]
      properties:
        code: { type: string, description: 'Invite code, format UZ-XXXX-XXXX', example: UZ-PLACEHOLDER-CODE }
        display_name: { type: string, minLength: 1, maxLength: 32, description: Trimmed; unique per server (case-insensitive) }
        device_id: { type: string, format: uuid }
        device_name: { type: string }
        platform: { type: string }
        arch: { type: string }
        player_version: { type: string }
        protocol_version: { type: integer, minimum: 1 }
        password: { type: string, minLength: 12, maxLength: 1024, description: 'Optional (`accounts_v1`). The new user gets this password (at least 12 characters; at most 1024 bytes). For an invite that belongs to an existing user it is used only while that user has no password' }
        install_id: { type: string, maxLength: 64, description: Optional. Groups the device rows of one app install }
    InviteRedeemApproved:
      type: object
      required: [status, hub_id, user_id, device_credential]
      properties:
        status: { type: string, enum: [approved] }
        hub_id: { type: string, format: uuid }
        user_id: { type: string, description: Server-local user ID of the new user }
        device_credential: { type: string, description: 'Prefix fbd_; delivered once' }
    DuplicateGameError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [existing_game_id]
          properties:
            existing_game_id: { type: string, format: uuid }
    FirmwareMode:
      type: string
      enum: [builtin, native]
      description: '`builtin` = the core uses its built-in firmware (files optional); `native` = files required.'
    FirmwareFile:
      type: object
      required: [id, display_name, required, present, size, sha256]
      properties:
        id: { type: string, example: bios7 }
        display_name: { type: string, example: ARM7 BIOS }
        required: { type: boolean, description: True only in mode `native` }
        present: { type: boolean }
        size: { type: integer, format: int64, nullable: true, description: Null when not present }
        sha256: { type: string, nullable: true, pattern: '^[0-9a-f]{64}$', description: Null when not present }
    SystemInfo:
      type: object
      required: [id, display_name, preferred_core_id, expected_core_version, firmware_mode, firmware]
      properties:
        id: { type: string, example: nds }
        display_name: { type: string, example: Nintendo DS }
        preferred_core_id: { type: string, example: melondsds, description: 'The default core. Together with `expected_core_version` and `core_package_version` it keeps describing the default core for apps without `cores_v2`.' }
        expected_core_version: { type: string, nullable: true, description: Null = any version }
        default_core_id:
          x-omitempty: false
          type: string
          nullable: true
          description: Id of the system's default core (`cores_v2`); null when no core is installed. Optional (absent on servers without `cores_v2`).
          example: melondsds
        cores:
          type: array
          description: One entry per installed core of the system (`cores_v2`). Optional (absent on servers without `cores_v2`).
          items: { $ref: '#/components/schemas/SystemCore' }
        core_package_version:
          x-omitempty: false
          type: string
          nullable: true
          description: Version of the preferred core the server serves (`cores_v1`) = `expected_core_version` if set, else the highest version with a cached package; null when none. The app provisions exactly this version. Optional (absent on servers without `cores_v1`).
          example: 1.4.0
        firmware_mode: { $ref: '#/components/schemas/FirmwareMode' }
        firmware:
          type: array
          items: { $ref: '#/components/schemas/FirmwareFile' }
    CoreOrigin:
      type: string
      enum: [libretro-buildbot, legacy-mirror]
      description: '`libretro-buildbot` = installed from the libretro buildbot; `legacy-mirror` = legacy package from the retired signed Uzume source.'
    SystemCore:
      type: object
      required: [core_id, display_name, version, license, experimental, origin]
      properties:
        core_id: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$', example: melondsds }
        display_name: { type: string, example: 'Nintendo DS (melonDS DS)' }
        version: { type: string, description: 'Package version: the server build id (UTC date of the upstream build, `2026.10.09`, `.N` appended for a second build the same day) or a legacy semver such as `1.4.0`. The app provisions exactly this version.', example: 2026.10.09 }
        license: { type: string, example: GPLv3 }
        experimental: { type: boolean, description: 'True when the app has no core profile for this core. Set by the server from its list of profiled cores.' }
        required_hw_api: { type: string, nullable: true, x-omitempty: false, description: 'Graphics API requirement from the core info, e.g. `OpenGL Core >= 3.2`; null when none.', example: 'OpenGL Core >= 3.2' }
        origin: { $ref: '#/components/schemas/CoreOrigin' }
        build_date: { type: string, format: date, description: Date of the upstream build, example: '2026-10-09' }
    CorePackageFile:
      type: object
      required: [name, role, size, sha256, available]
      properties:
        name: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$', example: melonds_ds_libretro.so }
        role: { type: string, enum: [library, license], description: Exactly one `library` per package }
        size: { type: integer, format: int64 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        available: { type: boolean, description: True when the file is in the server cache }
    CorePackage:
      type: object
      required: [core_id, version, platform, license, source_url, source_ref, files]
      properties:
        core_id: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$', example: melondsds }
        version: { type: string, pattern: '^[0-9A-Za-z][0-9A-Za-z.+_-]{0,63}$', example: 1.4.0 }
        platform: { $ref: '#/components/schemas/CorePlatform' }
        license: { type: string, description: 'License name. Packages from the libretro buildbot carry no license file; the name comes from the core info (`files` then has no `license` role entry).' }
        source_url: { type: string }
        source_ref: { type: string }
        origin: { $ref: '#/components/schemas/CoreOrigin' }
        files:
          type: array
          items: { $ref: '#/components/schemas/CorePackageFile' }
    PluginOrigin:
      type: string
      enum: [official, unverified]
      description: '`official` = valid signature of a trusted Uzume key; `unverified` = unsigned (or not verifiable), offered by the server admin.'
    PluginGame:
      type: object
      required: [system, codes]
      properties:
        system: { type: string }
        codes: { type: array, items: { type: string } }
    PluginRunSettingOption:
      type: object
      required: [value, label]
      properties:
        value: { type: string, pattern: '^[a-z][a-z0-9_]{0,31}$' }
        label: { type: string, description: 'i18n key, see `run_settings_strings`' }
    PluginRunSetting:
      type: object
      description: |
        One rule of the manifest field `run_settings`, shown in the app's "Start a run" dialog. The app sends
        the chosen values as `settings[<plugin_id>]` when it creates a run, nested by the key segments: keys `mode`
        and `rules.dupes_clause` become `{"mode": "soullink", "rules": {"dupes_clause": true}}`.
      required: [key, type, label, default]
      properties:
        key: { type: string, description: 'One or two dot-separated segments, each `^[a-z][a-z0-9_]{0,31}$`; unique within the plugin, never a segment prefix of another key.', example: rules.dupes_clause }
        type: { type: string, enum: [boolean, enum] }
        label: { type: string, pattern: '^[A-Za-z0-9_.-]{1,64}$', description: 'i18n key, see `run_settings_strings`' }
        hint: { type: string, pattern: '^[A-Za-z0-9_.-]{1,64}$', description: Optional i18n key }
        default:
          description: A boolean for type `boolean`, one of the option values (string) for type `enum`.
          oneOf: [{ type: boolean }, { type: string }]
        options:
          type: array
          minItems: 2
          maxItems: 8
          description: Only for type `enum`.
          items: { $ref: '#/components/schemas/PluginRunSettingOption' }
    PluginInfo:
      type: object
      required: [plugin_id, version, name, description, api, origin, sha256, size, permissions, requires, provides, games, created_at]
      properties:
        plugin_id: { type: string }
        version: { type: string }
        name: { type: string }
        description: { type: string }
        api: { type: integer, example: 1 }
        origin: { $ref: '#/components/schemas/PluginOrigin' }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        size: { type: integer, format: int64 }
        permissions: { type: array, items: { type: string } }
        requires:
          type: object
          description: Plugin id to version range, from the manifest
          additionalProperties: { type: string }
        provides: { type: array, items: { type: string } }
        games: { type: array, items: { $ref: '#/components/schemas/PluginGame' } }
        run_settings:
          type: array
          minItems: 1
          maxItems: 32
          description: Validated manifest field `run_settings`; absent when the manifest has none. Absent on servers before 1.17.0.
          items: { $ref: '#/components/schemas/PluginRunSetting' }
        run_settings_strings:
          type: object
          description: |
            Language (file name of `i18n/<lang>.json`, e.g. `en`, `de`, `pt-BR`) to i18n key to text, holding only the
            keys `run_settings` references (labels, hints, option labels). A key missing in a language is absent.
            Absent together with `run_settings`.
          additionalProperties:
            type: object
            additionalProperties: { type: string }
        created_at: { type: string, format: date-time }
    PluginList:
      type: object
      required: [plugins]
      properties:
        plugins:
          type: array
          items: { $ref: '#/components/schemas/PluginInfo' }
    CorePlatform:
      type: string
      enum: [windows-x64, linux-x64, linux-arm64, macos-x64, macos-arm64]
    CoreInfo:
      type: object
      required: [id, version]
      properties:
        id: { type: string }
        version: { type: string }
    HandshakeRequest:
      type: object
      additionalProperties: true
      required: [platform, arch, player_version, protocol_version, min_protocol_version, cores, video, audio, input]
      properties:
        platform: { type: string }
        arch: { type: string }
        player_version: { type: string }
        protocol_version: { type: integer, minimum: 1 }
        min_protocol_version: { type: integer, minimum: 1 }
        cores:
          type: array
          items: { $ref: '#/components/schemas/CoreInfo' }
        video:
          type: object
          additionalProperties: true
          required: [h264_encode, h264_decode, encoders]
          properties:
            h264_encode: { type: boolean }
            h264_decode: { type: boolean }
            encoders: { type: array, items: { type: string } }
        audio:
          type: object
          additionalProperties: true
          required: [opus]
          properties:
            opus: { type: boolean }
        input:
          type: object
          additionalProperties: true
          required: [gamepad, keyboard]
          properties:
            gamepad: { type: boolean }
            keyboard: { type: boolean }
    HandshakeProblem:
      type: object
      required: [code, detail]
      properties:
        code:
          type: string
          enum: [player_too_old, hub_too_old, core_missing, core_version_mismatch, capability_missing]
        detail: { type: string }
        core_id: { type: string }
    HandshakeResponse:
      type: object
      required: [hub_version, protocol_version, min_protocol_version, compatible, problems]
      properties:
        hub_version: { type: string }
        protocol_version: { type: integer, minimum: 1 }
        min_protocol_version: { type: integer, minimum: 1 }
        compatible: { type: boolean }
        problems:
          type: array
          items: { $ref: '#/components/schemas/HandshakeProblem' }
        features:
          type: array
          description: Optional server feature flags (additive, protocol_version unchanged). `saves_v1` = save sync API, `sessions_v1` = Sessions API and WSS endpoint, `users_v1` = invite redemption (`POST /invites/redeem`) and user management, `uploads_v1` = the calling user may upload ROMs (`POST /games`; advertised per caller), `firmware_v1` = systems registry and firmware download, `cores_v1` = signed core packages served by the server (`/api/v1/cores/...`, `core_package_version` in `SystemInfo`), `turn_v1` = at least one relay provider is on (the embedded TURN server and/or Cloudflare TURN; `turn_servers` in `hello_ack`, `ice_update` and the join response), `saves_v2` = save restore, manual snapshots, history labels and the `save_updated` WSS message, `saves_v3` = deleting manual snapshots (`DELETE /games/{game_id}/saves/{slot}/history/{version}`), `saves_v4` = uploading a save file into a slot (`POST /games/{game_id}/saves/{slot}/upload`), `saves_v5` = renaming a slot (`POST /games/{game_id}/saves/{slot}/rename`), deleting a slot (`DELETE /games/{game_id}/saves/{slot}`), `save_updated` reasons `renamed` and `deleted`, and 409 `session_running` on `saves_v4` uploads while a Session of the game runs, `saves_v6` = deleting any history version (before it only manual snapshots) and the main slot `default` (before it only other slots; renaming `default` stays refused), `cores_v2` = several cores per system (`default_core_id` and `cores` in `SystemInfo`; core ids follow `^[a-z0-9][a-z0-9_-]{0,63}$`), `ice_update_v1` = the server pushes the WSS message `ice_update` whenever its effective ICE configuration changes, `plugins_v1` = plugin list and download (`GET /plugins`, `GET /plugins/{plugin_id}/{version}/file`), `runs_v1` = runs, `local_roms_v1` = local-only games and resumable uploads (`POST /games/register`, `DELETE /games/{game_id}/registration`, `/uploads`; `stored`, `on_hub`, `roms`, `game_version`; `GET /roms/{sha256}` serves stored files only), `reports_v1` = problem reports (`POST /reports`; the admin endpoints under `/admin/reports`). `accounts_v1` = server accounts (`POST /auth/sign-in`, `/account` with password, confirmation and own devices, `/admin/users/{user_id}/password-reset`, `/admin/accounts/settings`; the error codes `confirmation_required`, `password_required` and `password_not_set`). `cores_index_v1` (signed core index) existed in 0.4 to 0.7 and was removed in 0.8.
          items: { type: string }
          example: [saves_v1, sessions_v1, users_v1, uploads_v1, firmware_v1, cores_v1, turn_v1, saves_v2, saves_v3, saves_v4, saves_v5, saves_v6, cores_v2, local_setup_v1, ice_update_v1, plugins_v1, runs_v1, local_roms_v1, reports_v1, accounts_v1]
        user:
          $ref: '#/components/schemas/HandshakeUser'
    HandshakeUser:
      type: object
      description: The server user the authenticated device belongs to (additive, protocol_version unchanged). Lets the app show who is signed in.
      required: [id, display_name, role]
      properties:
        id: { type: string, description: Server-local user ID }
        display_name: { type: string }
        role: { type: string, enum: [admin, user] }
    RomInfo:
      type: object
      required: [sha256, size, filename]
      properties:
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        size: { type: integer, format: int64 }
        filename: { type: string }
        stored: { type: boolean, description: 'The file is stored on the server and downloadable via `GET /roms/{sha256}`; false = only registered by an app (`local_roms_v1`; absent on older servers, then true).' }
    RegisterGameRequest:
      type: object
      required: [sha256, size, filename]
      properties:
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        size: { type: integer, format: int64, minimum: 1 }
        filename: { type: string, minLength: 1, maxLength: 255 }
        system: { type: string, description: 'System ID; derived from the file extension when omitted.' }
        title: { type: string, maxLength: 200, description: Default is the file name without extension }
        game_code: { type: string, description: 'Identity read from the ROM header by the app (same format as `Game.game_code`). Ignored when it does not fit the system.' }
        game_version: { type: integer, minimum: 0, description: 'ROM version read by the app; only used together with `game_code`.' }
    CreateUploadRequest:
      type: object
      required: [filename, size]
      properties:
        filename: { type: string, minLength: 1, maxLength: 255 }
        size: { type: integer, format: int64, minimum: 1, maximum: 4294967296 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$', description: 'Optional. When given, it is checked after the last chunk and a stored file with this hash is refused up front (409).' }
        title: { type: string, maxLength: 200 }
        system: { type: string }
    UploadSession:
      type: object
      required: [upload_id, offset, chunk_size]
      properties:
        upload_id: { type: string, format: uuid }
        offset: { type: integer, format: int64, minimum: 0, description: Bytes received so far; the next chunk starts here }
        chunk_size: { type: integer, format: int64, description: 'Largest chunk the server accepts (64 MiB)' }
    UploadStatus:
      type: object
      required: [upload_id, offset, size]
      properties:
        upload_id: { type: string, format: uuid }
        offset: { type: integer, format: int64, minimum: 0 }
        size: { type: integer, format: int64 }
    UploadProgress:
      type: object
      required: [offset]
      properties:
        offset: { type: integer, format: int64, minimum: 0 }
        game: { allOf: [ { $ref: '#/components/schemas/Game' } ], description: 'Set by the chunk that completes the upload.' }
    Game:
      type: object
      required: [id, title, system, rom, uploaded_by, added_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        system: { type: string, example: nds }
        rom: { allOf: [ { $ref: '#/components/schemas/RomInfo' } ], description: 'A file stored on the server if the game has one, else the primary file.' }
        on_hub: { type: boolean, description: 'At least one file of the game is stored on the server (`local_roms_v1`; absent on older servers, then true). A game that is not on the server is only visible to the users who registered a file of it.' }
        roms: { type: array, items: { $ref: '#/components/schemas/RomInfo' }, description: 'All known files of the game, the primary file first (`local_roms_v1`). Different dumps of the same identity are files of one game.' }
        game_version: { type: integer, minimum: 0, description: 'ROM version of the identity: NDS header byte 0x1E, 3DS NCCH version, GBA byte 0xBC, Game Boy byte 0x14C. Absent when unknown (`local_roms_v1`).' }
        uploaded_by: { type: string, description: Server-local user ID }
        added_at: { type: string, format: date-time }
        game_code: { type: string, description: 'Identity read from the ROM header on upload/import: 4-character NDS or GBA game code, 16 uppercase hex digits (3DS program ID) or the Game Boy header title (1 to 16 printable ASCII characters); the kind is `game_code_kind`; empty when unknown or unreadable. Absent on servers before 1.16.0.' }
        game_code_kind: { type: string, enum: ['', nds-gamecode, 3ds-titleid, gba-gamecode, gb-title], description: 'Kind of `game_code`; empty when unknown. `gba-gamecode`: 4-character GBA game code; `gb-title`: Game Boy / Game Boy Color header title (only with a valid header checksum).' }
    SaveSyncReason:
      type: string
      enum: [checkpoint, final, final_session_end, restore, upload]
    SaveHistoryReason:
      type: string
      enum: [session_end, device_change, before_conflict_resolution, conflict_upload, manual_snapshot, before_restore, before_upload]
    SaveCheckpoint:
      type: object
      description: Current checkpoint of a slot (one opaque blob).
      required: [revision, sha256, size, device_id, device_name, created_at, reason]
      properties:
        revision: { type: integer, minimum: 1, description: Per-slot checkpoint counter ("Rev N") }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        size: { type: integer, format: int64, maximum: 67108864 }
        device_id: { type: string, format: uuid }
        device_name: { type: string }
        created_at: { type: string, format: date-time }
        reason: { $ref: '#/components/schemas/SaveSyncReason' }
    SaveHistoryVersion:
      type: object
      description: Permanent history version with its own per-slot counter ("vN").
      required: [version, revision, sha256, size, device_id, device_name, created_at, reason]
      properties:
        version: { type: integer, minimum: 1 }
        revision: { type: integer, minimum: 1, description: Checkpoint revision captured }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        size: { type: integer, format: int64 }
        device_id: { type: string, format: uuid }
        device_name: { type: string }
        created_at: { type: string, format: date-time }
        reason: { $ref: '#/components/schemas/SaveHistoryReason' }
        label:
          x-omitempty: false
          type: string
          nullable: true
          maxLength: 64
          description: Optional label (manual snapshots, `saves_v2`); null or absent when none
    SaveConflictHubSide:
      type: object
      required: [revision, sha256, device_id, device_name, created_at]
      properties:
        revision: { type: integer, minimum: 1 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        device_id: { type: string, format: uuid }
        device_name: { type: string }
        created_at: { type: string, format: date-time }
    SaveConflictSecuredUpload:
      type: object
      required: [version, sha256, base_revision, device_id, device_name, created_at]
      properties:
        version: { type: integer, minimum: 1, description: History version holding the secured upload }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        base_revision: { type: integer, minimum: 0 }
        device_id: { type: string, format: uuid }
        device_name: { type: string }
        created_at: { type: string, format: date-time }
    SaveConflict:
      type: object
      required: [id, game_id, slot, status, hub, secured, created_at]
      properties:
        id: { type: string }
        game_id: { type: string, format: uuid }
        slot: { type: string }
        status: { type: string, enum: [open, resolved_hub, resolved_local] }
        hub: { $ref: '#/components/schemas/SaveConflictHubSide' }
        secured: { $ref: '#/components/schemas/SaveConflictSecuredUpload' }
        created_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true, x-omitempty: false }
        resolved_by: { type: string, nullable: true, x-omitempty: false, description: Server-local user ID or device ID of the resolver }
    SaveConflictError:
      type: object
      description: Error body of the upload 409 (`save_conflict`) carrying the conflict.
      required: [error, conflict]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string }
        conflict: { $ref: '#/components/schemas/SaveConflict' }
    SaveSlot:
      type: object
      required: [game_id, slot, current, open_conflicts]
      properties:
        game_id: { type: string, format: uuid }
        slot: { type: string, example: default }
        current: { $ref: '#/components/schemas/SaveCheckpoint' }
        open_conflicts:
          type: array
          items: { $ref: '#/components/schemas/SaveConflict' }
    SaveSlotSummary:
      type: object
      required: [game_id, slot, current, open_conflict_count]
      properties:
        game_id: { type: string, format: uuid }
        slot: { type: string, example: default }
        current: { $ref: '#/components/schemas/SaveCheckpoint' }
        open_conflict_count: { type: integer, minimum: 0 }
    SaveResolveRequest:
      type: object
      required: [resolution, expected_revision]
      properties:
        resolution: { type: string, enum: [use_hub, use_local] }
        expected_revision: { type: integer, minimum: 1, description: Current checkpoint revision the caller saw }
    SaveRestoreRequest:
      type: object
      required: [expected_revision]
      properties:
        expected_revision: { type: integer, minimum: 0, description: Current checkpoint revision the caller saw }
    SaveSlotRenameRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, pattern: '^[a-z0-9_-]{1,32}$', example: speedrun }
    SaveSnapshotRequest:
      type: object
      properties:
        label: { type: string, maxLength: 64 }
    TurnServer:
      type: object
      description: |
        Relay credentials from a relay provider of the server (`turn_v1`): the embedded TURN server (TURN REST API scheme),
        Cloudflare TURN or an external TURN server configured by the admin. Credentials are short-lived (`expires_at`)
        except the static username and password of an external TURN server, which have no `expires_at`. The server may
        send several entries; an app offers all of them to ICE.
      required: [urls, username, credential]
      properties:
        urls:
          type: array
          description: '`turn:` URLs (UDP and TCP transport)'
          items: { type: string, pattern: '^turns?:' }
          example: ['turn:hub.example.org:3478?transport=udp', 'turn:hub.example.org:3478?transport=tcp']
        username: { type: string }
        credential: { type: string }
        expires_at:
          type: string
          format: date-time
          description: End of validity; absent for static credentials that do not expire.
    SessionVisibility:
      type: string
      enum: [private, hub_users, invite_only]
      description: |
        `private`: only devices of the owner user. `hub_users`: every authenticated device of this server.
        `invite_only`: devices of the owner user plus invited users who have not declined.
    SessionOwner:
      type: object
      required: [user_id, display_name, device_name]
      properties:
        user_id: { type: string }
        display_name: { type: string }
        device_name: { type: string }
    SessionViewerInfo:
      type: object
      required: [viewer_id, display_name, device_name]
      properties:
        viewer_id: { type: string, format: uuid }
        display_name: { type: string, description: Display name of the viewer's user }
        device_name: { type: string }
    SessionInviteInfo:
      type: object
      required: [user_id, display_name, state, online]
      properties:
        user_id: { type: string }
        display_name: { type: string }
        state: { type: string, enum: [invited, declined, joined] }
        online: { type: boolean }
    Session:
      type: object
      required: [session_id, game_id, game_title, owner, visibility, created_at, viewer_count, is_owner, invited]
      properties:
        session_id: { type: string, format: uuid }
        game_id: { type: string, format: uuid }
        game_title: { type: string }
        owner: { $ref: '#/components/schemas/SessionOwner' }
        visibility: { $ref: '#/components/schemas/SessionVisibility' }
        created_at: { type: string, format: date-time }
        viewer_count: { type: integer, minimum: 0, maximum: 4 }
        viewers:
          type: array
          description: Only for the owner device
          items: { $ref: '#/components/schemas/SessionViewerInfo' }
        invites:
          type: array
          description: Only for the owner device
          items: { $ref: '#/components/schemas/SessionInviteInfo' }
        is_owner: { type: boolean, description: The caller is the owner device }
        invited: { type: boolean, description: The caller's user has an open invite }
    SessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items: { $ref: '#/components/schemas/Session' }
    SessionPublishRequest:
      type: object
      required: [game_id, visibility]
      properties:
        game_id: { type: string, format: uuid }
        visibility: { $ref: '#/components/schemas/SessionVisibility' }
    SessionUpdateRequest:
      type: object
      required: [visibility]
      properties:
        visibility: { $ref: '#/components/schemas/SessionVisibility' }
    SessionPermissions:
      type: object
      required: [view_video, hear_audio, send_input]
      properties:
        view_video: { type: boolean }
        hear_audio: { type: boolean }
        send_input: { type: boolean }
    SessionJoinResponse:
      type: object
      required: [viewer_id, permissions, ice_servers]
      properties:
        viewer_id: { type: string, format: uuid }
        permissions: { $ref: '#/components/schemas/SessionPermissions' }
        ice_servers:
          type: array
          description: '`stun:` URLs from the server config (default `stun:stun.cloudflare.com:3478`, empty with `-ice-servers none`), plus the server''s own STUN when the embedded TURN server is on'
          items: { type: string }
        turn_servers:
          type: array
          description: Optional relay credentials from every active relay provider (embedded TURN and/or Cloudflare TURN); present only while a provider is on (`turn_v1`)
          items: { $ref: '#/components/schemas/TurnServer' }
    UserInfo:
      type: object
      required: [id, display_name, online]
      properties:
        id: { type: string }
        display_name: { type: string }
        online: { type: boolean }
    UserList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items: { $ref: '#/components/schemas/UserInfo' }
    RunJsonObject:
      type: object
      description: An opaque JSON object the server stores byte-exact and never interprets.
      additionalProperties: true
      x-go-type: json.RawMessage
    RunStatus:
      type: string
      enum: [starting, active, paused, finished, abandoned]
    RunPluginRef:
      type: object
      required: [plugin_id, version]
      properties:
        plugin_id: { type: string, pattern: '^[a-z0-9-]+(\.[a-z0-9-]+)+$', maxLength: 128 }
        version: { type: string, minLength: 1, maxLength: 64 }
    RunPlugin:
      type: object
      required: [plugin_id, version, sha256]
      properties:
        plugin_id: { type: string }
        version: { type: string }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$', description: SHA-256 of the .fbplugin the server offered when the run was created }
    RunParticipant:
      type: object
      required: [user_id, user_name, status, game_id, color, states]
      properties:
        user_id: { type: string }
        user_name: { type: string }
        status: { type: string, enum: [invited, joined, declined, left] }
        game_id: { type: string, format: uuid, nullable: true, description: Server library game; set on join }
        color: { type: integer, minimum: 0, maximum: 7, nullable: true, description: App colour in join order; null until the first join }
        states:
          type: object
          description: State per plugin id; only plugins that have a row (a missing plugin means state `{}` with revision 0)
          additionalProperties: { $ref: '#/components/schemas/RunPluginState' }
    RunPluginState:
      type: object
      required: [state, state_rev, updated_at]
      properties:
        state: { $ref: '#/components/schemas/RunJsonObject' }
        state_rev: { type: integer, format: int64, minimum: 1 }
        updated_at: { type: string, format: date-time }
    Run:
      type: object
      required: [run_id, name, status, created_by, created_at, updated_at, status_by, settings, plugins, participants, last_seq]
      properties:
        run_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 64 }
        status: { $ref: '#/components/schemas/RunStatus' }
        created_by: { type: string, description: User id of the creator }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        status_by: { type: string, description: User id (a participant or the server admin) who set the last status }
        settings: { $ref: '#/components/schemas/RunJsonObject' }
        plugins:
          type: array
          minItems: 1
          maxItems: 8
          items: { $ref: '#/components/schemas/RunPlugin' }
        participants:
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/RunParticipant' }
        last_seq: { type: integer, format: int64, minimum: 0 }
    RunList:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items: { $ref: '#/components/schemas/Run' }
    RunCreateRequest:
      type: object
      required: [name, plugins, game_id]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        plugins:
          type: array
          minItems: 1
          maxItems: 8
          items: { $ref: '#/components/schemas/RunPluginRef' }
        game_id: { type: string, format: uuid }
        invite_user_ids:
          type: array
          maxItems: 7
          items: { type: string, minLength: 1, maxLength: 64 }
        settings: { $ref: '#/components/schemas/RunJsonObject' }
    RunJoinRequest:
      type: object
      required: [game_id]
      properties:
        game_id: { type: string, format: uuid }
    RunInviteRequest:
      type: object
      required: [user_ids]
      properties:
        user_ids:
          type: array
          minItems: 1
          maxItems: 8
          items: { type: string, minLength: 1, maxLength: 64 }
    RunStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [active, paused, finished, abandoned] }
    RunStateRequest:
      type: object
      required: [base_rev, state]
      properties:
        base_rev: { type: integer, format: int64, minimum: 0 }
        state: { $ref: '#/components/schemas/RunJsonObject' }
    RunStateResponse:
      type: object
      required: [state_rev]
      properties:
        state_rev: { type: integer, format: int64, minimum: 1 }
    RunStateConflictError:
      type: object
      description: Error body of the state 409. `state_rev` and `state` are present with `state_conflict` and carry the current values.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string }
        state_rev: { type: integer, format: int64, minimum: 0 }
        state: { $ref: '#/components/schemas/RunJsonObject' }
    RunEvent:
      type: object
      required: [seq, created_at, user_id, user_name, device_id, plugin_id, source, type, text, payload, client_id]
      properties:
        seq: { type: integer, format: int64, minimum: 1, description: 'Per run, from 1, gapless' }
        created_at: { type: string, format: date-time }
        user_id: { type: string, nullable: true, description: null for server events (who it is about is in the payload) }
        user_name: { type: string }
        device_id: { type: string, nullable: true }
        plugin_id: { type: string, nullable: true }
        source: { type: string, enum: [automatic, manual, hub] }
        type: { type: string, pattern: '^[a-z0-9_.-]{1,64}$', description: 'server events: `run.created`, `run.joined`, `run.declined`, `run.invited`, `run.left`, `run.status`' }
        text: { type: string, maxLength: 280 }
        payload: { $ref: '#/components/schemas/RunJsonObject' }
        client_id: { type: string, format: uuid }
    RunEventRequest:
      type: object
      required: [client_id, plugin_id, source, type]
      properties:
        client_id: { type: string, format: uuid }
        plugin_id: { type: string, pattern: '^[a-z0-9-]+(\.[a-z0-9-]+)+$', maxLength: 128 }
        source: { type: string, enum: [automatic, manual] }
        type: { type: string, pattern: '^[a-z0-9_.-]{1,64}$' }
        text: { type: string, maxLength: 280, default: '' }
        payload: { $ref: '#/components/schemas/RunJsonObject' }
    RunEventResult:
      type: object
      required: [seq]
      properties:
        seq: { type: integer, format: int64, minimum: 1 }
    RunEventList:
      type: object
      required: [events, last_seq]
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/RunEvent' }
        last_seq: { type: integer, format: int64, minimum: 0 }
    RunBoardRequest:
      type: object
      required: [tree]
      properties:
        tree: { $ref: '#/components/schemas/RunJsonObject' }
    RunBoardResult:
      type: object
      required: [rev]
      properties:
        rev: { type: integer, format: int64, minimum: 1 }
    AdminBackupSettings:
      type: object
      required: [mode, weekday, time, keep, include_roms, folder]
      properties:
        mode: { type: string, enum: [off, daily, weekly] }
        weekday: { type: integer, minimum: 0, maximum: 6, description: '0 = Sunday; used by weekly' }
        time: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', description: "Time of day in the server's local time zone", example: '03:00' }
        keep: { type: integer, minimum: 1, maximum: 365, description: Regular backups kept; older ones are deleted after a new one succeeded }
        include_roms: { type: boolean }
        folder: { type: string, description: Backup folder; empty = not set (backups are off) }
    AdminBackupSettingsUpdate:
      type: object
      properties:
        mode: { type: string, enum: [off, daily, weekly] }
        weekday: { type: integer, minimum: 0, maximum: 6 }
        time: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$' }
        keep: { type: integer, minimum: 1, maximum: 365 }
        include_roms: { type: boolean }
        folder: { type: string }
    AdminBackup:
      type: object
      required: [name, created, size, safety, includes_roms, restored]
      properties:
        name: { type: string, example: uzume-server-home-hub-20261014T010000Z.tar }
        created: { type: string, format: date-time }
        size: { type: integer, format: int64 }
        safety: { type: boolean, description: Made automatically before a restore; kept until deleted }
        contents: { type: string, description: 'For example "Database · saves · plugins · ROMs"' }
        includes_roms: { type: boolean }
        hub_version: { type: string }
        schema_version: { type: integer }
        error: { type: string, description: Set when the file is damaged or unreadable }
        restored: { type: boolean, description: The last restore used this file }
    AdminUpdateVersions:
      type: object
      required: [current, current_schema, can_rollback, in_container, backup_folder, connected_players, versions]
      properties:
        current: { type: string, description: The running server version, example: '0.16.4' }
        current_schema: { type: integer, description: Database schema version in use }
        can_rollback: { type: boolean, description: 'This server can go back by itself: package install, not a container, updates on' }
        unavailable: { type: string, description: Why `can_rollback` is false }
        in_container: { type: boolean, description: The server runs in the official image; go back by pulling the older image tag }
        paused: { $ref: '#/components/schemas/AdminUpdatePause' }
        skipped: { type: string, description: The version going back skipped; it is not installed automatically }
        skipped_available: { type: boolean, description: The skipped version is still the newest available one }
        backup_folder: { type: string, description: Where the safety backup is written }
        connected_players: { type: integer }
        versions:
          type: array
          items: { $ref: '#/components/schemas/AdminUpdateVersion' }
    AdminUpdateVersion:
      type: object
      required: [version, channel, published_at, schema_version, data]
      properties:
        version: { type: string, example: 0.16.3 }
        channel: { type: string, enum: [stable, beta] }
        published_at: { type: string, format: date-time }
        notes_url: { type: string }
        first_used: { type: string, format: date-time, description: First time this version ran on this server (local history) }
        last_used: { type: string, format: date-time }
        schema_version: { type: integer, description: 'Database schema of the version, 0 when the index does not say' }
        data:
          type: string
          enum: [keep, restore, refuse]
          description: '`keep` the data stays as it is; `restore` the automatic pre-update database backup replaces it; `refuse` going back is not safe'
        reason: { type: string, description: Why going back is refused }
        db_backup: { type: string, description: 'The automatic database backup used by `restore`' }
        lost_since: { type: string, format: date-time, description: 'With `restore`: changes after this time are only in the safety backup' }
        manual_command: { type: string, description: What to do by hand when the server cannot go back itself }
    AdminUpdatePause:
      type: object
      required: [from, to, at]
      properties:
        from: { type: string, description: The version that was left }
        to: { type: string, description: The version rolled back to }
        at: { type: string, format: date-time }
        by: { type: string }
        backup: { type: string, description: Safety backup file made before going back }
        restored_db: { type: string, description: Pre-update database backup that replaced the database }
        lost_since: { type: string, format: date-time }
    AdminRollbackRequest:
      type: object
      required: [version]
      properties:
        version: { type: string, example: 0.16.3 }
        confirm_data_loss: { type: boolean, description: 'Required when `data` is `restore`: accept that changes since `lost_since` leave the running server' }
    AdminRollbackResult:
      type: object
      required: [version, data, safety_backup, safety_folder]
      properties:
        version: { type: string }
        data: { type: string, enum: [keep, restore] }
        safety_backup: { type: string }
        safety_folder: { type: string }
    AdminBackupList:
      type: object
      required: [backups]
      properties:
        backups:
          type: array
          items: { $ref: '#/components/schemas/AdminBackup' }
    AdminBackupRun:
      type: object
      required: [ok, started, finished]
      properties:
        ok: { type: boolean }
        started: { type: string, format: date-time }
        finished: { type: string, format: date-time }
        name: { type: string }
        size: { type: integer, format: int64 }
        error: { type: string }
        no_space: { type: boolean, description: The backup folder had too little free space. The server never deletes backups to make room. }
        by: { type: string, description: '"schedule" or the admin who started it' }
        skipped: { type: integer, description: Files that vanished while the backup ran }
        prune_note: { type: string }
    AdminBackupProgress:
      type: object
      required: [kind, phase, done_bytes, total_bytes, started]
      properties:
        kind: { type: string, enum: [backup, restore] }
        phase: { type: string, example: saves and snapshots }
        step: { type: integer, description: 'restore only: 1 safety backup, 2 verify and prepare, 3 restarting' }
        done_bytes: { type: integer, format: int64 }
        total_bytes: { type: integer, format: int64 }
        started: { type: string, format: date-time }
        by: { type: string }
        eta_seconds: { type: integer }
    AdminRestoreResult:
      type: object
      required: [ok, at, backup]
      properties:
        ok: { type: boolean }
        at: { type: string, format: date-time }
        backup: { type: string }
        backup_created: { type: string, format: date-time }
        includes_roms: { type: boolean }
        safety: { type: string, description: File name of the safety backup made before the restore }
        error: { type: string }
    AdminBackupStatus:
      type: object
      required: [settings, folder_set, can_restore]
      properties:
        settings: { $ref: '#/components/schemas/AdminBackupSettings' }
        folder_set: { type: boolean }
        write_error: { type: string, description: Set when the folder cannot be written }
        disk_total: { type: integer, format: int64 }
        disk_free: { type: integer, format: int64 }
        running: { $ref: '#/components/schemas/AdminBackupProgress' }
        last: { $ref: '#/components/schemas/AdminBackupRun' }
        last_ok: { $ref: '#/components/schemas/AdminBackupRun' }
        next: { type: string, format: date-time }
        restore: { $ref: '#/components/schemas/AdminRestoreResult' }
        can_restore: { type: boolean, description: 'This server can restart itself, so a restore from the API is possible' }
    SignInRequest:
      type: object
      required: [username, password, device_id, device_name, platform, arch, app_version, protocol_version]
      properties:
        username: { type: string, minLength: 1, maxLength: 64, description: The sign-in name (case-insensitive; not the display name) }
        password: { type: string, minLength: 1, maxLength: 1024 }
        device_id: { type: string, format: uuid, description: Chosen by the app; use a separate one per signed-in user }
        device_name: { type: string }
        platform: { type: string }
        arch: { type: string }
        app_version: { type: string }
        protocol_version: { type: integer, minimum: 1 }
        install_id: { type: string, maxLength: 64, description: Optional. Groups the device rows of one app install (several users on one PC) }
    Account:
      type: object
      required: [user_id, username, display_name, role, has_password, password_required, must_change_password, confirmed_until, confirm_locked_until]
      properties:
        user_id: { type: string }
        username: { type: string }
        display_name: { type: string }
        role: { type: string, enum: [admin, user] }
        has_password: { type: boolean }
        password_required: { type: boolean, description: True for admins and while the server requires passwords }
        must_change_password: { type: boolean, description: Set by an admin's password reset; cleared by `setAccountPassword` }
        confirmed_until: { type: string, format: date-time, nullable: true, description: This device's "Confirm it's you" state; null when none or expired }
        confirm_locked_until: { type: string, format: date-time, nullable: true, description: Confirming is locked on this device until then; null when not locked }
    AccountUpdate:
      type: object
      required: [display_name]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 32 }
    AccountPasswordSet:
      type: object
      required: [new_password]
      properties:
        current_password: { type: string, maxLength: 1024, description: Required when the account has a password }
        new_password: { type: string, minLength: 12, maxLength: 1024, description: 'At least 12 characters; at most 1024 bytes' }
    AccountPasswordRemove:
      type: object
      required: [current_password]
      properties:
        current_password: { type: string, maxLength: 1024 }
    AccountConfirm:
      type: object
      required: [password]
      properties:
        password: { type: string, maxLength: 1024 }
        duration_seconds: { type: integer, enum: [120, 300, 900], default: 300 }
    AccountConfirmed:
      type: object
      required: [confirmed_until]
      properties:
        confirmed_until: { type: string, format: date-time }
    AccountDevice:
      type: object
      required: [device_id, name, platform, arch, app_version, created_at, last_seen_at, sign_in_kind, status, install_id, current]
      properties:
        device_id: { type: string, format: uuid }
        name: { type: string }
        platform: { type: string }
        arch: { type: string }
        app_version: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time, nullable: true }
        sign_in_kind: { type: string, enum: [approval, invite, password, local], description: 'approval = an admin approved it, invite = onboarding invite or pairing code, password = user name and password, local = app on the same PC as the server' }
        status: { type: string, enum: [trusted, revoked] }
        install_id: { type: string, nullable: true }
        current: { type: boolean, description: The device of this request }
    AccountDeviceList:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          items: { $ref: '#/components/schemas/AccountDevice' }
    AccountSignOutAll:
      type: object
      properties:
        include_current: { type: boolean, default: false }
    AccountSignOutAllResult:
      type: object
      required: [signed_out]
      properties:
        signed_out: { type: integer, minimum: 0 }
    AdminPasswordReset:
      type: object
      required: [temporary_password, must_change_password]
      properties:
        temporary_password: { type: string, description: Shown once; never stored in plain text or logged }
        must_change_password: { type: boolean }
    AdminAccountSettings:
      type: object
      required: [require_passwords]
      properties:
        require_passwords: { type: boolean }
