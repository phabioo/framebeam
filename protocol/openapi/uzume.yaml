      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunJoinRequest' }
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RunConflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
  /api/v1/runs/{run_id}/invite:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      operationId: inviteRun
      tags: [runs]
      summary: Invite more users (any joined participant, while the run is starting, active or paused)
      description: |
        Users who are already invited or joined are skipped; users who declined or left are invited again. Unknown
        or disabled users are a 400. More than 8 participants in total are a 409. Appends the server event `run.invited`
        and sends `run_updated`. If nobody is newly invited the run is returned unchanged and nothing is appended.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunInviteRequest' }
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RunConflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
  /api/v1/runs/{run_id}/decline:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      operationId: declineRun
      tags: [runs]
      summary: Decline the invite (only from invited; declining again is a no-op)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RunConflict' }
  /api/v1/runs/{run_id}/leave:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      operationId: leaveRun
      tags: [runs]
      summary: Leave a run the caller joined (leaving again is a no-op); colour and state stay
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RunConflict' }
  /api/v1/runs/{run_id}/status:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      operationId: setRunStatus
      tags: [runs]
      summary: Change the run status
      description: |
        `active`: from `starting` by the creator, from `paused` by any joined participant. `paused`: from `active`,
        any joined participant. `finished` or `abandoned`: the creator, from any run that is not over. Other
        transitions are 409 `conflict`; the right transition by the wrong user is 403. The server appends a `run.status` event.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunStatusRequest' }
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RunConflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
  /api/v1/runs/{run_id}/state/{plugin_id}:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - name: plugin_id
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: putRunState
      tags: [runs]
      summary: Replace the caller's own state of one plugin (JSON object, at most 64 KiB) against a base revision
      description: |
        Each participant has one state object per plugin of the run, each with its own revision. `plugin_id` must be a
        plugin of the run (404 `not_found`). `base_rev` must equal the current `state_rev` of that plugin (0 when none
        was written yet), otherwise 409 `state_conflict` with the current `state_rev` and `state`. Joined participants
        only (403 otherwise). Starting and active runs only (409 `run_not_active`). Rate limit 4/s, burst 20 per
        participant (all plugins together; 429 `rate_limited`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunStateRequest' }
      responses:
        '200':
          description: State stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunStateResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`state_conflict` (carries the current state) or `run_not_active`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunStateConflictError' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/runs/{run_id}/events:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      operationId: appendRunEvent
      tags: [runs]
      summary: Append an event to the log (joined participants)
      description: |
        `client_id` makes the call idempotent: the same `client_id` again returns 200 with the original `seq`.
        `plugin_id` must be a plugin of the run. Starting and active runs only (409 `run_not_active`); at most
        50 000 events per run (409 `conflict`). Rate limit 2/s, burst 30 per participant (429 `rate_limited`).
        Payload at most 4 KiB (413 `too_large`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunEventRequest' }
      responses:
        '200':
          description: The event already existed (same `client_id`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunEventResult' }
        '201':
          description: Event appended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunEventResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RunConflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      operationId: listRunEvents
      tags: [runs]
      summary: Events with seq greater than `after`, in order (joined participants)
      description: |
        Only joined participants read the event log. Invited, declined and left participants get 403 `forbidden`;
        everybody else 404.
      security:
        - bearerAuth: []
      parameters:
        - name: after
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        '200':
          description: Events and the run's current `last_seq`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunEventList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/runs/{run_id}/boards/{plugin_id}:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/RunPluginId'
    put:
      operationId: putRunBoard
      tags: [runs]
      summary: Publish the plugin's board (building-block tree, at most 64 KiB) for the server web run page
      description: |
        Joined participants only (403 otherwise); the plugin must be a plugin of the run (404). Starting and active runs
        only (409 `run_not_active`). Rate limit 1/s, burst 5 per participant (429 `rate_limited`). The server checks the
        shape (a JSON object) and the size, not the building blocks.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunBoardRequest' }
      responses:
        '200':
          description: Board stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunBoardResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RunConflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/admin/status:
    get:
      operationId: getAdminStatus
      tags: [admin]
      summary: Server health (admin only)
      description: |
        The same data as the Status page of the web interface: identity, uptime, open problems (most urgent first),
        CPU, memory, the disk of the data directory, running Sessions, the built-in TURN relay, connected apps and
        the warnings and errors of the last 24 hours (secrets removed). Needs the access token of a device of an
        admin user, otherwise 403.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/admin/status/log:
    get:
      operationId: getAdminStatusLog
      tags: [admin]
      summary: Download the recent server log (admin only)
      description: The last log lines the server keeps in memory as plain text, redacted like the diagnostics bundle.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Log text
          headers:
            Content-Disposition: { schema: { type: string }, example: 'attachment; filename="uzume-server-log-20261022-081500.txt"' }
          content:
            text/plain:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/admin/metrics:
    get:
      operationId: getAdminMetrics
      tags: [admin]
      summary: State of the Prometheus metrics endpoint (admin only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current setting
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMetrics' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    put:
      operationId: setAdminMetrics
      tags: [admin]
      summary: Switch the Prometheus metrics endpoint on or off (admin only)
      description: |
        Off by default; while off `GET /metrics` answers 404. Switching it on for the first time creates a token and
        returns it once in `token`; later calls never return it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminMetricsUpdate' }
            examples:
              default: { value: { enabled: true } }
      responses:
        '200':
          description: The setting now stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMetrics' }
        '400':
          description: Invalid body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/admin/metrics/token:
    post:
      operationId: createAdminMetricsToken
      tags: [admin]
      summary: Create a new metrics token (admin only)
      description: Replaces the token; the previous one stops working at once. The new token is returned once, the server keeps only a hash.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The new token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMetricsToken' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/reports:
    post:
      operationId: createReport
      tags: [reports]
      summary: Send a problem report to the server (`reports_v1`)
      description: |
        Any paired device of any user. `multipart/form-data` with a `meta` part (JSON, `ReportMeta`) and up to 12 file
        parts named `files` (the file name of each part is the attachment name; `[A-Za-z0-9._-]`, at most 80 characters).
        The whole report is limited to 25 MiB (413 `payload_too_large`); a device may send 5 reports per hour (429
        `rate_limited`). The server removes secrets from the description and from text attachments again. Admins see the
        report under Reports; it is kept until an admin deletes it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [meta]
              properties:
                meta: { $ref: '#/components/schemas/ReportMeta' }
                files: { type: array, items: { type: string, format: binary } }
            encoding:
              meta: { contentType: application/json }
              files: { contentType: application/octet-stream }
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/admin/reports:
    get:
      operationId: listAdminReports
      tags: [admin]
      summary: List problem reports, newest first (admin only, `reports_v1`)
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Only reports with this status; the counts always cover all reports
          schema: { type: string, enum: [new, seen] }
      responses:
        '200':
          description: Reports
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminReportList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/admin/reports/{id}:
    get:
      operationId: getAdminReport
      tags: [admin]
      summary: One problem report with its description and file list (admin only)
      description: Opening a report does not mark it seen.
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200':
          description: The report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deleteAdminReport
      tags: [admin]
      summary: Delete a problem report and its files (admin only)
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/admin/reports/{id}/seen:
    post:
      operationId: markAdminReportSeen
      tags: [admin]
      summary: Mark a problem report as seen (admin only)
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200':
          description: The report, now `seen`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/admin/reports/{id}/files/{name}:
    get:
      operationId: getAdminReportFile
      tags: [admin]
      summary: Download one attachment (admin only)
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: File bytes
          headers:
            Content-Length: { schema: { type: integer, format: int64 } }
            Content-Disposition: { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/admin/reports/{id}/archive:
    get:
      operationId: getAdminReportArchive
      tags: [admin]
      summary: Download all attachments and the description as one zip (admin only)
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200':
          description: Zip archive
          headers:
            Content-Disposition: { schema: { type: string }, example: 'attachment; filename="uzume-report-12.zip"' }
          content:
            application/zip:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/ws:
    get:
      operationId: connectWebSocket
      tags: [ws]
      summary: WSS upgrade (presence, Session events, signaling; documentation only, the upgrade is not a JSON call)
      description: |
        Upgrade to WebSocket with the access token as Bearer header. Messages are JSON text frames in the envelope
        `{type, id?, payload}`; every message type has a schema (`ws-<type>.schema.json`) and an example in
        `protocol/schemas/`. The first client message must be `hello`; the server answers `hello_ack` (a short `features` list for the WSS connection; the authoritative list is the one of the handshake response,
        `ice_servers`, `turn_servers`). With `ice_update_v1` the server pushes `ice_update` (`ice_servers`, `turn_servers?`, the ICE part of
        `hello_ack`) to every connected app whenever its effective ICE configuration changes; the app uses the new lists for
        PeerConnections created afterwards. Message types: `hello`, `hello_ack`, `presence_update`, `session_update`, `save_updated`,
        `session_ended`, `session_invite`, `viewer_joined`, `viewer_left`, `signal`, `ice_update`, `run_updated`, `run_state`, `run_event`, `error`. With `runs_v1` the optional `hello` field `runs` (`[{run_id, last_seq}]`, the last event the app saw per run) triggers the run catch-up after `hello_ack`: `run_updated` for every non-archived run the user participates in, then, for the listed runs the user joined, the `run_event`s with `seq` > `last_seq`, at most 500 per run (none when more are missing; page with `GET /runs/{run_id}/events`). The server sends a WebSocket ping every 20 s. The connection stays valid until the device is revoked.
      security:
        - bearerAuth: []
      responses:
        '101': { description: Switching Protocols }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/admin/backups:
    get:
      operationId: listAdminBackups
      tags: [admin]
      summary: List the backup files of the backup folder (admin)
      description: Newest first. Safety backups (made before a restore) are listed too and are never removed by the retention.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The backups
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminBackupList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: startAdminBackup
      tags: [admin]
      summary: Start a backup now (admin)
      description: |
        Starts one backup in the background and returns at once; follow it with `getAdminBackupStatus`. Apps keep
        playing. 400 when no backup folder is set or it cannot be written, 409 `conflict` when a backup or restore is
        already running.
      security:
        - bearerAuth: []
      responses:
        '202': { description: Started }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/AdminBackupConflict' }
  /api/v1/admin/backups/status:
    get:
      operationId: getAdminBackupStatus
      tags: [admin]
      summary: Backup status with progress of a running job (admin)
      description: Settings, folder state and free space, the running job (bytes done and total, phase), the last attempt, the last good backup, the next scheduled run and the result of the last restore.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminBackupStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/backups/cancel:
    post:
      operationId: cancelAdminBackup
      tags: [admin]
      summary: Cancel the running backup (admin)
      description: The partial file is removed. A restore can be canceled until its safety backup is done; 409 `conflict` when nothing can be canceled.
      security:
        - bearerAuth: []
      responses:
        '204': { description: Canceling }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/AdminBackupConflict' }
  /api/v1/admin/backups/settings:
    get:
      operationId: getAdminBackupSettings
      tags: [admin]
      summary: Backup settings (admin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminBackupSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: updateAdminBackupSettings
      tags: [admin]
      summary: Change backup settings (admin)
      description: Only the given fields change. `folder` is an absolute path (an empty string unsets it, which turns backups off); it cannot be inside the saves, plugins, firmware, tls or roms directories of the data folder.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminBackupSettingsUpdate' }
            examples:
              default: { value: { mode: daily, time: '03:00', keep: 7, include_roms: false, folder: /mnt/backup/uzume } }
      responses:
        '200':
          description: The settings now stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminBackupSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/backups/restore-result:
    delete:
      operationId: dismissAdminRestoreResult
      tags: [admin]
      summary: Dismiss the result of the last restore (admin)
      security:
        - bearerAuth: []
      responses:
        '204': { description: Dismissed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/backups/{name}:
    delete:
      operationId: deleteAdminBackup
      tags: [admin]
      summary: Delete one backup file (admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AdminBackupName'
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/AdminBackupConflict' }
  /api/v1/admin/backups/{name}/download:
    get:
      operationId: downloadAdminBackup
      tags: [admin]
      summary: Download one backup file (admin, streamed, range support)
      description: The file contains secrets (TLS key, password hashes). Keep it as private as the data folder.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AdminBackupName'
      responses:
        '200':
          description: The archive
          content:
            application/x-tar:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/admin/backups/{name}/restore:
    post:
      operationId: restoreAdminBackup
      tags: [admin]
      summary: Restore a backup (admin)
      description: |
        Makes a safety backup first, verifies every checksum, then restarts the server, which swaps the database and data
        in before it opens the database. Returns 202 at once; running Sessions end and apps reconnect. Follow it with
        `getAdminBackupStatus` (`running.step` 1 to 3, then the server restarts and `restore` holds the result). 400 when
        the backup was made by a newer server or this server cannot restart itself; a damaged file is reported in `restore`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AdminBackupName'
      responses:
        '202': { description: Started }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/AdminBackupConflict' }
  /api/v1/admin/updates/versions:
    get:
      operationId: getAdminUpdateVersions
      tags: [admin]
      summary: Earlier versions the server can go back to (admin)
      description: |
        The last five earlier releases of the signed update index (the channel of the install plus versions this server
        ran before) that speak the running protocol version, newest first, and what going back does to the data
        (`data`: `keep` the data as it is, `restore` the automatic backup made before the update replaces the
        database and changes since `lost_since` are only in the safety backup, `refuse` with a `reason`). Also the
        pause after going back. Fetches the signed index, so it can take a moment and fails when the index cannot be
        reached.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The versions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUpdateVersions' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/updates/rollback:
    post:
      operationId: rollbackAdminUpdate
      tags: [admin]
      summary: Go back to an earlier version (admin)
      description: |
        Writes a safety backup without ROMs (into the backup folder, else `backups/` of the data folder), stages the
        older package, pauses automatic updates and asks the root helper to install it; the server restarts a moment
        later. When the older version needs an older database schema, the database is replaced by the automatic
        backup made before the update; that needs `confirm_data_loss` (409 `conflict` without it, with the time
        after which changes are lost). 409 `conflict` also when going back is refused (see `versions`). 400 when the
        version is not in the list, the server runs in a container (pull the older image tag instead) or was not
        installed from the package. Returns 202 at once.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminRollbackRequest' }
            examples:
              default: { value: { version: 0.16.3 } }
      responses:
        '202':
          description: Started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminRollbackResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/AdminUpdateConflict' }
  /api/v1/admin/updates/resume:
    post:
      operationId: resumeAdminUpdates
      tags: [admin]
      summary: Resume automatic updates after going back (admin)
      description: Puts the automatic-install setting back as it was before going back. The skipped version is still not installed automatically. 409 `conflict` when updates are not paused.
      security:
        - bearerAuth: []
      responses:
        '204': { description: Resumed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/AdminUpdateConflict' }
  /api/v1/auth/sign-in:
    post:
      operationId: signIn
      tags: [auth]
      summary: Sign a device in with user name and password (no auth)
      description: |
        Replaces waiting for an admin's approval (`accounts_v1`). On success the device is trusted (sign-in kind
        `password`) and the response has the shape of an approved pairing request: server id, user id and the device
        credential, delivered once. The app then uses `createAccessToken`. Old access tokens of that `device_id` are
        deleted. A trusted device of another user is never taken over (409 `conflict`). Use a separate `device_id` per
        signed-in user and the same `install_id` when several users share one PC.

        A wrong user name, a wrong password and a user without a password all give the same 401 `invalid_credentials`
        (no user enumeration). Rate limited per remote IP (10 attempts a minute) and per user name: 10 failures lock
        the sign-in for that name for 15 minutes (429 `rate_limited` with `retry_after`; the failure that locks already
        answers 429). A correct password of a disabled user gives 401 `user_disabled`. When an admin reset the password,
        sign-in still works and `getAccount` reports `must_change_password`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignInRequest' }
            examples:
              default:
                value:
                  username: anna
                  password: PLACEHOLDER-PASSWORD
                  device_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                  device_name: Anna-Laptop
                  platform: linux
                  arch: x86_64
                  app_version: 0.18.0
                  protocol_version: 1
                  install_id: 2b1c0d9e-5f7a-4c3b-8e21-6d4f9a0b7c15
      responses:
        '200':
          description: Signed in (credential delivered once)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PairingStatus' }
              examples:
                default:
                  value:
                    status: approved
                    hub_id: 3f2b8c1e-5d4a-4b7e-9a10-0c1d2e3f4a5b
                    user_id: u_placeholder_2
                    device_credential: fbd_PLACEHOLDER_DEVICE_CREDENTIAL
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: invalid_credentials (one answer for every wrong combination) or user_disabled (correct password, user turned off)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                invalid: { value: { error: { code: invalid_credentials, message: Invalid credentials } } }
                user_disabled: { value: { error: { code: user_disabled, message: User has been disabled } } }
        '409':
          description: The device ID already belongs to a trusted device of another user (`conflict`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                default: { value: { error: { code: conflict, message: This device ID already belongs to a device of another user } } }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/account:
    get:
      operationId: getAccount
      tags: [account]
      summary: The signed-in user's account as seen from this device
      description: |
        `password_required` is true for admins and while the server requires passwords. `confirmed_until` is this
        device's "Confirm it's you" state (null when none or expired); `confirm_locked_until` is set while confirming is
        locked on this device.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
              examples:
                default:
                  value:
                    user_id: u_placeholder_2
                    username: anna
                    display_name: Anna
                    role: user
                    has_password: true
                    password_required: false
                    must_change_password: false
                    confirmed_until: null
                    confirm_locked_until: null
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      operationId: updateAccount
      tags: [account]
      summary: Rename yourself
      description: Same rules as everywhere (1 to 32 characters, trimmed, unique per server, case-insensitive). 409 `display_name_taken` when the name is taken. Returns the account.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountUpdate' }
            examples:
              default: { value: { display_name: Anna } }
      responses:
        '200':
          description: The account after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Display name already taken (case-insensitive)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                default: { value: { error: { code: display_name_taken, message: Display name is already taken } } }
  /api/v1/account/password:
    put:
      operationId: setAccountPassword
      tags: [account]
      summary: Set or change your password
      description: |
        `new_password` needs at least 12 characters and at most 1024 bytes (400 `bad_request`). `current_password` is
        required when the account has a password; a wrong one answers 401 `invalid_credentials` and counts like a wrong
        password of `confirmAccount` (3 wrong ones lock both for 5 minutes on this device: 429 `rate_limited`).
        Clears `must_change_password`. The user's other devices stay signed in (use `signOutAllAccountDevices` to end them).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountPasswordSet' }
            examples:
              default: { value: { current_password: PLACEHOLDER-OLD-PASSWORD, new_password: PLACEHOLDER-NEW-PASSWORD } }
      responses:
        '204': { description: Password set }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Not authenticated (`unauthorized`) or the current password is wrong (`invalid_credentials`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                default: { value: { error: { code: invalid_credentials, message: Invalid credentials } } }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: removeAccountPassword
      tags: [account]
      summary: Remove your password (members only)
      description: |
        Refused with 403 `password_required` for admins (an admin's password can never be removed) and while the server
        requires passwords (`getAdminAccountSettings`). `current_password` is checked like in `setAccountPassword`.
        A member without a password gets 204 and nothing changes. Ends the confirmation of the user's devices.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountPasswordRemove' }
            examples:
              default: { value: { current_password: PLACEHOLDER-PASSWORD } }
      responses:
        '204': { description: Password removed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Not authenticated (`unauthorized`) or the current password is wrong (`invalid_credentials`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                default: { value: { error: { code: invalid_credentials, message: Invalid credentials } } }
        '403':
          description: A password is required for this account (`password_required`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                default: { value: { error: { code: password_required, message: An admin's password cannot be removed } } }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/account/confirm:
    post:
      operationId: confirmAccount
      tags: [account]
      summary: Confirm it's you
      description: |
        Checks the password and confirms this device for `duration_seconds` (120, 300 or 900, default 300). Dangerous
        steps (restore or delete a backup, go back to an older version, reset a password, change the password policy)
        answer 403 `confirmation_required` until then. 3 wrong passwords on this device lock confirming for 5 minutes:
        the third already answers 429 `rate_limited` with `retry_after`; `getAccount` reports `confirm_locked_until`.
        A success resets the count. 409 `password_not_set` when the account has no password.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountConfirm' }
            examples:
              default: { value: { password: PLACEHOLDER-PASSWORD, duration_seconds: 300 } }
      responses:
        '200':
          description: Confirmed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountConfirmed' }
              examples:
                default: { value: { confirmed_until: '2026-10-22T12:05:00Z' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Not authenticated (`unauthorized`) or wrong password (`invalid_credentials`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                default: { value: { error: { code: invalid_credentials, message: Invalid credentials } } }
        '409':
          description: The account has no password (`password_not_set`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                default: { value: { error: { code: password_not_set, message: This account has no password } } }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: endAccountConfirmation
      tags: [account]
      summary: End the confirmation of this device early
      security:
        - bearerAuth: []
      responses:
        '204': { description: Ended (also when there was none) }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/account/devices:
    get:
      operationId: listAccountDevices
      tags: [account]
      summary: Your own devices
      description: All devices of the signed-in user, newest first, signed-out ones (`status` `revoked`) included. Devices of other users are never listed.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The devices
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountDeviceList' }
              examples:
                default:
                  value:
                    devices:
                      - device_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                        name: Anna-Laptop
                        platform: linux
                        arch: x86_64
                        app_version: 0.18.0
                        created_at: '2026-10-20T09:00:00Z'
                        last_seen_at: '2026-10-22T11:58:00Z'
                        sign_in_kind: password
                        status: trusted
                        install_id: 2b1c0d9e-5f7a-4c3b-8e21-6d4f9a0b7c15
                        current: true
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/account/devices/sign-out-all:
    post:
      operationId: signOutAllAccountDevices
      tags: [account]
      summary: Sign out all your devices
      description: Revokes every trusted device of the user like an admin revoke (access tokens die, live connections close). The calling device stays signed in unless `include_current` is true. Returns how many devices were signed out.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountSignOutAll' }
            examples:
              default: { value: { include_current: false } }
      responses:
        '200':
          description: Signed out
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountSignOutAllResult' }
              examples:
                default: { value: { signed_out: 2 } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/account/devices/{device_id}:
    delete:
      operationId: signOutAccountDevice
      tags: [account]
      summary: Sign out one of your devices
      description: Revokes the device like an admin revoke (access tokens die, live connections close). Can be the calling device. 404 `not_found` for a device of another user.
      security:
        - bearerAuth: []
      parameters:
        - name: device_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Signed out }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/admin/users/{user_id}/password-reset:
    post:
      operationId: resetAdminUserPassword
      tags: [admin]
      summary: Reset a user's password (admin, needs Confirm it's you)
      description: |
        Sets a one-time temporary password (four groups of four symbols, no ambiguous characters), returned once. The
        user must change it (`must_change_password`); their devices stay signed in and a sign-in lockout ends. 403
        `confirmation_required` without a valid confirmation of the caller's device, 403 `forbidden` for non-admins and
        for the caller themself, 404 `not_found` for an unknown user.
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The temporary password (shown once)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPasswordReset' }
              examples:
                default: { value: { temporary_password: PLCH-OLDR-PASS-WORD, must_change_password: true } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Not allowed (`forbidden`) or the caller must confirm first (`confirmation_required`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                default: { value: { error: { code: forbidden, message: Not allowed } } }
                confirmation: { value: { error: { code: confirmation_required, message: Confirm it's you first } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/admin/accounts/settings:
    get:
      operationId: getAdminAccountSettings
      tags: [admin]
      summary: Account policy (admin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAccountSettings' }
              examples:
                default: { value: { require_passwords: false } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: updateAdminAccountSettings
      tags: [admin]
      summary: Change the account policy (admin, needs Confirm it's you)
      description: |
        `require_passwords`: members cannot remove their password while it is on. Users without a password are not
        touched and can still sign in by approval. 403 `confirmation_required` without a valid confirmation.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminAccountSettings' }
            examples:
              default: { value: { require_passwords: true } }
      responses:
        '200':
          description: The policy after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAccountSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Not an admin (`forbidden`) or the caller must confirm first (`confirmation_required`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                default: { value: { error: { code: confirmation_required, message: Confirm it's you first } } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access token (opaque, prefix fba_, 15 min).
    pollTokenAuth:
      type: http
      scheme: bearer
      description: Poll token of a pairing request (opaque, prefix fbp_).
  parameters:
    AdminBackupName:
      name: name
      in: path
      required: true
      schema: { type: string, pattern: '^uzume-server-[a-z0-9-]+-[0-9]{8}T[0-9]{6}Z(-safety)?\.tar$' }
      example: uzume-server-home-hub-20261014T010000Z.tar
    CoreId:
      name: core_id
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$' }
      example: melondsds
    CoreVersion:
      name: version
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9A-Za-z][0-9A-Za-z.+_-]{0,63}$' }
      example: 1.4.0
    PluginId:
      name: plugin_id
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9-]+(\.[a-z0-9-]+)+$', maxLength: 128 }
      example: net.example.tracker
    PluginVersion:
      name: version
      in: path
      required: true
      schema: { type: string, maxLength: 128 }
      example: 1.2.0
    CorePlatform:
      name: platform
      in: path
      required: true
      schema: { $ref: '#/components/schemas/CorePlatform' }
      example: linux-x64
    GameId:
      name: game_id
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 9a1b2c3d-4e5f-4a6b-8c7d-0e1f2a3b4c5d
    SessionId:
      name: session_id
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 4e8d2a60-7b1c-4f3e-8a5d-6c7b8a9d0e1f
    UserId:
      name: user_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
      example: u_placeholder_2
    SaveSlotName:
      name: slot
      in: path
      required: true
      description: Slot name; always `default` in the PoC.
      schema: { type: string, pattern: '^[a-z0-9_-]{1,32}$' }
      example: default
    RunId:
      name: run_id
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 6f1d2c3b-4a5e-4b6c-8d7e-9f0a1b2c3d4e
    RunPluginId:
      name: plugin_id
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9-]+(\.[a-z0-9-]+)+$', maxLength: 128 }
      example: net.example.runnotes
  examples:
    SaveConflictValue:
      value:
        id: c_placeholder_1
        game_id: 9a1b2c3d-4e5f-4a6b-8c7d-0e1f2a3b4c5d
        slot: default
        status: open
        hub:
