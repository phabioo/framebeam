  /api/v1/saves:
    get:
      operationId: listSaves
      tags: [saves]
      summary: Save slots of the authenticated device's user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Slots of the caller (only the owner's own slots)
          content:
            application/json:
              schema:
                type: object
                required: [saves]
                properties:
                  saves:
                    type: array
                    items: { $ref: '#/components/schemas/SaveSlotSummary' }
              examples:
                default:
                  value:
                    saves:
                      - game_id: 9a1b2c3d-4e5f-4a6b-8c7d-0e1f2a3b4c5d
                        slot: default
                        current:
                          revision: 3
                          sha256: '1111111111111111111111111111111111111111111111111111111111111111'
                          size: 524288
                          device_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                          device_name: Wohnzimmer-PC
                          created_at: '2026-01-01T12:00:00Z'
                          reason: checkpoint
                        open_conflict_count: 0
                empty:
                  value: { saves: [] }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/games/{game_id}/saves/{slot}:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/SaveSlotName'
    get:
      operationId: getSaveSlot
      tags: [saves]
      summary: Current checkpoint metadata and open conflicts of a slot
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Slot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaveSlot' }
              examples:
                default: { $ref: '#/components/examples/SaveSlotExample' }
                with_conflict: { $ref: '#/components/examples/SaveSlotConflictExample' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: putSave
      tags: [saves]
      summary: Upload the save file (raw body) against a base revision
      description: |
        Raw `application/octet-stream` body (max 64 MiB, opaque, never interpreted by the Hub).
        Rules, evaluated in order inside one transaction per slot:
        1. SHA-256 equals the current checkpoint -> 200 with the current slot, no new revision (idempotent retry).
        2. `X-FrameBeam-Base-Revision` equals the current revision (0 and no slot yet) -> new revision, 200.
        3. Otherwise -> 409 `save_conflict`: the upload is secured as history version (`conflict_upload`),
           an open conflict is created or updated (at most one open conflict per slot and device) and
           returned in `conflict`. The current checkpoint stays unchanged.
        A hash mismatch returns 400 `bad_request`; oversize bodies 413 `payload_too_large`.
      security:
        - bearerAuth: []
      parameters:
        - name: X-FrameBeam-Base-Revision
          in: header
          required: true
          description: Checkpoint revision the upload is based on; 0 = the Player had no Hub save.
          schema: { type: integer, minimum: 0 }
          example: 3
        - name: X-FrameBeam-Content-SHA256
          in: header
          required: true
          description: Lowercase hex SHA-256 of the body; verified by the Hub.
          schema: { type: string, pattern: '^[0-9a-f]{64}$' }
          example: '2222222222222222222222222222222222222222222222222222222222222222'
        - name: X-FrameBeam-Sync-Reason
          in: header
          required: true
          schema: { $ref: '#/components/schemas/SaveSyncReason' }
          example: checkpoint
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Accepted (new revision) or identical to the current checkpoint (unchanged)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaveSlot' }
              examples:
                accepted: { $ref: '#/components/examples/SaveSlotExample' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Stale base revision; the upload was secured and a conflict recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaveConflictError' }
              examples:
                default:
                  value:
                    error: { code: save_conflict, message: Base revision is stale; upload secured as conflict }
                    conflict:
                      id: c_placeholder_1
                      game_id: 9a1b2c3d-4e5f-4a6b-8c7d-0e1f2a3b4c5d
                      slot: default
                      status: open
                      hub:
                        revision: 3
                        sha256: '1111111111111111111111111111111111111111111111111111111111111111'
                        device_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                        device_name: Wohnzimmer-PC
                        created_at: '2026-01-01T12:00:00Z'
                      secured:
                        version: 4
                        sha256: '2222222222222222222222222222222222222222222222222222222222222222'
                        base_revision: 2
                        device_id: 5d0f4e2a-1b3c-4d5e-8f60-718293a4b5c6
                        device_name: Laptop
                        created_at: '2026-01-01T13:00:00Z'
                      created_at: '2026-01-01T13:00:00Z'
                      resolved_at: null
                      resolved_by: null
        '413':
          description: Body exceeds 64 MiB
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                default: { value: { error: { code: payload_too_large, message: Save exceeds 64 MiB } } }
    delete:
      operationId: deleteSaveSlot
      tags: [saves]
      summary: Delete a slot with its whole history (`saves_v5`, main slot since `saves_v6`)
      description: |
        Hard delete: checkpoint, history, conflict records and content files of the slot are removed for good; there
        is no undo. The request must confirm the checkpoint revision the caller saw in the required query parameter
        `confirm_revision`; any other value returns 409 `save_conflict_stale` and nothing is deleted, so a stale
        client cannot delete newer progress. A missing or non-numeric `confirm_revision` returns 400 `bad_request`.
        The main slot `default` can be deleted since `saves_v6` (before, 409 `save_slot_protected`). Other errors: 404 for an unknown slot; 409 `session_running`
        while an active Session of the calling user runs the game; 409 `conflict` while the slot has an open
        conflict (resolve it first). Other devices of the user get `save_updated` with reason `deleted` (slot,
        revision and sha256 are those of the deleted checkpoint). The deletion is logged by the Hub.
      security:
        - bearerAuth: []
      parameters:
        - name: confirm_revision
          in: query
          required: true
          description: Current checkpoint revision the caller saw.
          schema: { type: integer, minimum: 1 }
          example: 3
      responses:
        '204': { description: Slot deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Stale `confirm_revision`, running Session or open conflict (before `saves_v6` also the default slot); nothing deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                stale: { value: { error: { code: save_conflict_stale, message: Slot changed since expected_revision; re-read the slot } } }
                session_running: { value: { error: { code: session_running, message: A Session of this game is running; end it first } } }
  /api/v1/games/{game_id}/saves/{slot}/rename:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/SaveSlotName'
    post:
      operationId: renameSaveSlot
      tags: [saves]
      summary: Rename a slot (`saves_v5`)
      description: |
        The slot keeps its checkpoint, full history and conflicts; only the name changes. The new name must match the
        slot name pattern and must not be a Windows reserved device name (`con`, `prn`, `aux`, `nul`, `com1`-`com9`,
        `lpt1`-`lpt9`) or the current name: 400 `bad_request`. 404 for an unknown slot; 409 `save_slot_exists` if the
        new name is taken; 409 `save_slot_protected` for the `default` slot (it cannot be renamed; deleting it is allowed since `saves_v6`);
        409 `session_running` while an active Session of the calling user runs the game. Other devices of the user
        get `save_updated` with reason `renamed`, `slot` = the new name and `previous_slot` = the old name.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveSlotRenameRequest' }
            examples:
              default: { value: { name: speedrun } }
      responses:
        '200':
          description: Renamed; the slot under its new name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaveSlot' }
              examples:
                default: { $ref: '#/components/examples/SaveSlotExample' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Name taken, default slot or running Session; nothing changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                exists: { value: { error: { code: save_slot_exists, message: A slot with this name already exists } } }
                protected: { value: { error: { code: save_slot_protected, message: The default slot cannot be renamed } } }
                session_running: { value: { error: { code: session_running, message: A Session of this game is running; end it first } } }
        '413': { $ref: '#/components/responses/TooLarge' }
  /api/v1/games/{game_id}/saves/{slot}/content:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/SaveSlotName'
    get:
      operationId: downloadSaveContent
      tags: [saves]
      summary: Bytes of the current checkpoint
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current checkpoint content
          headers:
            ETag: { schema: { type: string }, description: Strong ETag = content SHA-256, example: '"1111111111111111111111111111111111111111111111111111111111111111"' }
            X-FrameBeam-Save-Revision: { schema: { type: integer, minimum: 1 }, description: Checkpoint revision of the content, example: 3 }
            Content-Length: { schema: { type: integer, format: int64 } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/games/{game_id}/saves/{slot}/history:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/SaveSlotName'
    get:
      operationId: listSaveHistory
      tags: [saves]
      summary: Permanent history versions of a slot (newest first)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: History versions
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions:
                    type: array
                    items: { $ref: '#/components/schemas/SaveHistoryVersion' }
              examples:
                default:
                  value:
                    versions:
                      - version: 2
                        revision: 3
                        sha256: '1111111111111111111111111111111111111111111111111111111111111111'
                        size: 524288
                        device_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                        device_name: Wohnzimmer-PC
                        created_at: '2026-01-01T12:00:00Z'
                        reason: session_end
                      - version: 1
                        revision: 1
                        sha256: '3333333333333333333333333333333333333333333333333333333333333333'
                        size: 524288
                        device_id: 5d0f4e2a-1b3c-4d5e-8f60-718293a4b5c6
                        device_name: Laptop
                        created_at: '2025-12-31T20:00:00Z'
                        reason: device_change
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/games/{game_id}/saves/{slot}/history/{version}/content:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/SaveSlotName'
      - name: version
        in: path
        required: true
        description: History version number (vN)
        schema: { type: integer, minimum: 1 }
        example: 1
    get:
      operationId: downloadSaveHistoryContent
      tags: [saves]
      summary: Bytes of a history version
      security:
        - bearerAuth: []
      responses:
        '200':
          description: History version content
          headers:
            ETag: { schema: { type: string }, description: Strong ETag = content SHA-256 }
            X-FrameBeam-Save-Revision: { schema: { type: integer, minimum: 1 }, description: Checkpoint revision captured by this version, example: 1 }
            Content-Length: { schema: { type: integer, format: int64 } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/games/{game_id}/saves/{slot}/history/{version}:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/SaveSlotName'
      - name: version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
        example: 2
    delete:
      operationId: deleteSaveVersion
      tags: [saves]
      summary: Delete a version from the history (`saves_v3`, any version since `saves_v6`)
      description: |
        Any history version can be deleted (`saves_v6`); before `saves_v6` only versions with reason
        `manual_snapshot` could be deleted and others returned 409 `save_not_snapshot` (no longer returned). The
        secured version of an open conflict of the slot cannot be deleted: 409 `conflict` (resolve the conflict
        first). The version number is never reused. The current checkpoint and all other versions are not touched,
        and no `save_updated` is sent. The content file is removed only when no checkpoint, version or conflict
        still uses it. The deletion is logged by the Hub.
      security:
        - bearerAuth: []
      responses:
        '204': { description: Version deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The version is the secured version of an open conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                default: { value: { error: { code: conflict, message: Resolve the open conflict first } } }
  /api/v1/games/{game_id}/saves/{slot}/history/{version}/restore:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/SaveSlotName'
      - name: version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
        example: 2
    post:
      operationId: restoreSaveHistoryVersion
      tags: [saves]
      summary: Restore a history version as the new checkpoint (`saves_v2`)
      description: |
        `expected_revision` must equal the current checkpoint revision, otherwise 409 `save_conflict_stale`
        (nothing changed, the caller re-reads the slot). The current checkpoint is first secured into history
        (`before_restore`, unless already captured); then the version's content becomes the new checkpoint
        (revision + 1, reason `restore`, device = caller). Other devices get `save_updated`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveRestoreRequest' }
            examples:
              default: { value: { expected_revision: 3 } }
      responses:
        '200':
          description: Restored; the slot after the restore
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaveSlot' }
              examples:
                default: { $ref: '#/components/examples/SaveSlotExample' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: expected_revision is stale; nothing changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                default: { value: { error: { code: save_conflict_stale, message: Slot changed since expected_revision; re-read the slot } } }
        '413': { $ref: '#/components/responses/TooLarge' }
  /api/v1/games/{game_id}/saves/{slot}/upload:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/SaveSlotName'
    post:
      operationId: uploadSaveFile
      tags: [saves]
      summary: Upload a save file (e.g. from another emulator) into a slot (`saves_v4`)
      description: |
        Raw `application/octet-stream` body (max 64 MiB, opaque, never interpreted by the Hub). Unlike `putSave`
        this is a deliberate replacement and never creates a conflict: `X-FrameBeam-Expected-Revision` must equal the
        current checkpoint revision (0 = the slot must not exist yet), otherwise 409 `save_conflict_stale` and nothing
        changes. An existing checkpoint is first secured into history (`before_upload`, unless already captured);
        then the body becomes the new checkpoint (revision + 1, reason `upload`, device = caller). A missing slot is
        created at revision 1. A body identical to the current checkpoint changes nothing (200, idempotent).
        Other devices get `save_updated` with reason `upload`.
        An invalid slot name, an empty body, a hash mismatch or a bad header returns 400 `bad_request`; an unknown
        game 404; oversize bodies 413 `payload_too_large`. While an active Session of the calling user runs the
        game (`saves_v5`) the upload is refused with 409 `session_running` and nothing changes.
      security:
        - bearerAuth: []
      parameters:
        - name: X-FrameBeam-Expected-Revision
          in: header
          required: true
          description: Current checkpoint revision the caller saw; 0 = the slot must not exist yet.
          schema: { type: integer, minimum: 0 }
          example: 3
        - name: X-FrameBeam-Content-SHA256
          in: header
          required: true
          description: Lowercase hex SHA-256 of the body; verified by the Hub.
          schema: { type: string, pattern: '^[0-9a-f]{64}$' }
          example: '2222222222222222222222222222222222222222222222222222222222222222'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Uploaded (new revision) or identical to the current checkpoint (unchanged)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaveSlot' }
              examples:
                default: { $ref: '#/components/examples/SaveSlotExample' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Expected revision does not match (`save_conflict_stale`) or a Session of the game runs (`session_running`); nothing changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                default: { value: { error: { code: save_conflict_stale, message: Slot changed since expected_revision; re-read the slot } } }
                session_running: { value: { error: { code: session_running, message: A Session of this game is running; end it first } } }
        '413':
          description: Body exceeds 64 MiB
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                default: { value: { error: { code: payload_too_large, message: Save exceeds 64 MiB } } }
  /api/v1/games/{game_id}/saves/{slot}/snapshots:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/SaveSlotName'
    post:
      operationId: createSaveSnapshot
      tags: [saves]
      summary: Create a manual snapshot of the current checkpoint (`saves_v2`)
      description: |
        Creates a history version with reason `manual_snapshot` from the current checkpoint, with an optional
        label. 404 when the slot has no checkpoint. Snapshots are never thinned by retention.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveSnapshotRequest' }
            examples:
              default: { value: { label: Before final boss } }
      responses:
        '201':
          description: Snapshot created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaveHistoryVersion' }
              examples:
                default:
                  value:
                    version: 3
                    revision: 3
                    sha256: '1111111111111111111111111111111111111111111111111111111111111111'
                    size: 524288
                    device_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                    device_name: Wohnzimmer-PC
                    created_at: '2026-01-01T12:30:00Z'
                    reason: manual_snapshot
                    label: Before final boss
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
  /api/v1/games/{game_id}/saves/{slot}/conflicts/{conflict_id}/resolve:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/SaveSlotName'
      - name: conflict_id
        in: path
        required: true
        schema: { type: string }
        example: c_placeholder_1
    post:
      operationId: resolveSaveConflict
      tags: [saves]
      summary: Resolve an open save conflict
      description: |
        `expected_revision` must equal the current checkpoint revision, otherwise 409 `save_conflict_stale`
        (nothing changed, the caller re-reads the slot). Before applying, the current checkpoint is copied
        to history (`before_conflict_resolution`). `use_hub`: conflict -> `resolved_hub`, the secured upload
        stays in history. `use_local`: the secured upload becomes a new checkpoint (revision + 1),
        conflict -> `resolved_local`. Resolving an already resolved conflict returns 409 `save_conflict_stale`.
        "Keep both, decide later" is no call; the conflict simply stays `open`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveResolveRequest' }
            examples:
              use_hub: { value: { resolution: use_hub, expected_revision: 3 } }
              use_local: { value: { resolution: use_local, expected_revision: 3 } }
      responses:
        '200':
          description: Resolved; the slot after the resolution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaveSlot' }
              examples:
                default: { $ref: '#/components/examples/SaveSlotExample' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: expected_revision is stale or the conflict is already resolved; nothing changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                default: { value: { error: { code: save_conflict_stale, message: Slot changed since expected_revision; re-read the slot } } }
        '413': { $ref: '#/components/responses/TooLarge' }
