        '403': { $ref: '#/components/responses/SessionForbidden' }
        '404': { $ref: '#/components/responses/SessionNotFound' }
        '410': { $ref: '#/components/responses/SessionEnded' }
  /api/v1/ws:
    get:
      operationId: connectWebSocket
      tags: [ws]
      summary: WSS upgrade (presence, Session events, signaling; documentation only, the upgrade is not a JSON call)
      description: |
        Upgrade to WebSocket with the access token as Bearer header. Messages are JSON text frames in the envelope
        `{type, id?, payload}`; every message type has a schema (`ws-<type>.schema.json`) and an example in
        `protocol/schemas/`. The first client message must be `hello`; the Hub answers `hello_ack` (features,
        `ice_servers`). The Hub sends a WebSocket ping every 20 s. The connection stays valid until the device is revoked.
      security:
        - bearerAuth: []
      responses:
        '101': { description: Switching Protocols }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access token (opaque, prefix fba_, 15 min).
    pollTokenAuth:
      type: http
      scheme: bearer
      description: Poll token of a pairing request (opaque, prefix fbp_).
  parameters:
    CoreId:
      name: core_id
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9_]{1,64}$' }
      example: melonds_ds
    CoreVersion:
      name: version
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9A-Za-z][0-9A-Za-z.+_-]{0,63}$' }
      example: 1.4.0
    CorePlatform:
      name: platform
      in: path
      required: true
      schema: { $ref: '#/components/schemas/CorePlatform' }
      example: linux-x64
    GameId:
      name: game_id
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 9a1b2c3d-4e5f-4a6b-8c7d-0e1f2a3b4c5d
    SessionId:
      name: session_id
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 4e8d2a60-7b1c-4f3e-8a5d-6c7b8a9d0e1f
    UserId:
      name: user_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
      example: u_placeholder_2
    SaveSlotName:
      name: slot
      in: path
      required: true
      description: Slot name; always `default` in the PoC.
      schema: { type: string, pattern: '^[a-z0-9_-]{1,32}$' }
      example: default
  examples:
    SaveConflictValue:
      value:
        id: c_placeholder_1
        game_id: 9a1b2c3d-4e5f-4a6b-8c7d-0e1f2a3b4c5d
        slot: default
        status: open
        hub:
          revision: 3
          sha256: '1111111111111111111111111111111111111111111111111111111111111111'
          device_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
          device_name: Wohnzimmer-PC
          created_at: '2026-01-01T12:00:00Z'
        secured:
          version: 4
          sha256: '2222222222222222222222222222222222222222222222222222222222222222'
          base_revision: 2
          device_id: 5d0f4e2a-1b3c-4d5e-8f60-718293a4b5c6
          device_name: Laptop
          created_at: '2026-01-01T13:00:00Z'
        created_at: '2026-01-01T13:00:00Z'
        resolved_at: null
        resolved_by: null
    SaveSlotExample:
      value:
        game_id: 9a1b2c3d-4e5f-4a6b-8c7d-0e1f2a3b4c5d
        slot: default
        current:
