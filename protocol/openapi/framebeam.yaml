    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      operationId: inviteRun
      tags: [runs]
      summary: Invite more users (any joined participant, while the run is starting, active or paused)
      description: |
        Users who are already invited or joined are skipped; users who declined or left are invited again. Unknown
        or disabled users are a 400. More than 8 participants in total are a 409. Appends the Hub event `run.invited`
        and sends `run_updated`. If nobody is newly invited the run is returned unchanged and nothing is appended.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunInviteRequest' }
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RunConflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
  /api/v1/runs/{run_id}/decline:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      operationId: declineRun
      tags: [runs]
      summary: Decline the invite (only from invited; declining again is a no-op)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RunConflict' }
  /api/v1/runs/{run_id}/leave:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      operationId: leaveRun
      tags: [runs]
      summary: Leave a run the caller joined (leaving again is a no-op); colour and state stay
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RunConflict' }
  /api/v1/runs/{run_id}/status:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      operationId: setRunStatus
      tags: [runs]
      summary: Change the run status
      description: |
        `active`: from `starting` by the creator, from `paused` by any joined participant. `paused`: from `active`,
        any joined participant. `finished` or `abandoned`: the creator, from any run that is not over. Other
        transitions are 409 `conflict`; the right transition by the wrong user is 403. The Hub appends a `run.status` event.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunStatusRequest' }
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RunConflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
  /api/v1/runs/{run_id}/state/{plugin_id}:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - name: plugin_id
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: putRunState
      tags: [runs]
      summary: Replace the caller's own state of one plugin (JSON object, at most 64 KiB) against a base revision
      description: |
        Each participant has one state object per plugin of the run, each with its own revision. `plugin_id` must be a
        plugin of the run (404 `not_found`). `base_rev` must equal the current `state_rev` of that plugin (0 when none
        was written yet), otherwise 409 `state_conflict` with the current `state_rev` and `state`. Joined participants
        only (403 otherwise). Starting and active runs only (409 `run_not_active`). Rate limit 4/s, burst 20 per
        participant (all plugins together; 429 `rate_limited`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunStateRequest' }
      responses:
        '200':
          description: State stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunStateResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`state_conflict` (carries the current state) or `run_not_active`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunStateConflictError' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/runs/{run_id}/events:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      operationId: appendRunEvent
      tags: [runs]
      summary: Append an event to the log (joined participants)
      description: |
        `client_id` makes the call idempotent: the same `client_id` again returns 200 with the original `seq`.
        `plugin_id` must be a plugin of the run. Starting and active runs only (409 `run_not_active`); at most
        50 000 events per run (409 `conflict`). Rate limit 2/s, burst 30 per participant (429 `rate_limited`).
        Payload at most 4 KiB (413 `too_large`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunEventRequest' }
      responses:
        '200':
          description: The event already existed (same `client_id`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunEventResult' }
        '201':
          description: Event appended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunEventResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RunConflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      operationId: listRunEvents
      tags: [runs]
      summary: Events with seq greater than `after`, in order (joined participants)
      description: |
        Only joined participants read the event log. Invited, declined and left participants get 403 `forbidden`;
        everybody else 404.
      security:
        - bearerAuth: []
      parameters:
        - name: after
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        '200':
          description: Events and the run's current `last_seq`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunEventList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/runs/{run_id}/boards/{plugin_id}:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/RunPluginId'
    put:
      operationId: putRunBoard
      tags: [runs]
      summary: Publish the plugin's board (building-block tree, at most 64 KiB) for the Hub web run page
      description: |
        Joined participants only (403 otherwise); the plugin must be a plugin of the run (404). Starting and active runs
        only (409 `run_not_active`). Rate limit 1/s, burst 5 per participant (429 `rate_limited`). The Hub checks the
        shape (a JSON object) and the size, not the building blocks.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunBoardRequest' }
      responses:
        '200':
          description: Board stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunBoardResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RunConflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/ws:
    get:
      operationId: connectWebSocket
      tags: [ws]
      summary: WSS upgrade (presence, Session events, signaling; documentation only, the upgrade is not a JSON call)
      description: |
        Upgrade to WebSocket with the access token as Bearer header. Messages are JSON text frames in the envelope
        `{type, id?, payload}`; every message type has a schema (`ws-<type>.schema.json`) and an example in
        `protocol/schemas/`. The first client message must be `hello`; the Hub answers `hello_ack` (a short `features` list for the WSS connection; the authoritative list is the one of the handshake response,
        `ice_servers`, `turn_servers`). With `ice_update_v1` the Hub pushes `ice_update` (`ice_servers`, `turn_servers?`, the ICE part of
        `hello_ack`) to every connected Player whenever its effective ICE configuration changes; the Player uses the new lists for
        PeerConnections created afterwards. Message types: `hello`, `hello_ack`, `presence_update`, `session_update`, `save_updated`,
        `session_ended`, `session_invite`, `viewer_joined`, `viewer_left`, `signal`, `ice_update`, `run_updated`, `run_state`, `run_event`, `error`. With `runs_v1` the optional `hello` field `runs` (`[{run_id, last_seq}]`, the last event the Player saw per run) triggers the run catch-up after `hello_ack`: `run_updated` for every non-archived run the user participates in, then, for the listed runs the user joined, the `run_event`s with `seq` > `last_seq`, at most 500 per run (none when more are missing; page with `GET /runs/{run_id}/events`). The Hub sends a WebSocket ping every 20 s. The connection stays valid until the device is revoked.
      security:
        - bearerAuth: []
      responses:
        '101': { description: Switching Protocols }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access token (opaque, prefix fba_, 15 min).
    pollTokenAuth:
      type: http
      scheme: bearer
      description: Poll token of a pairing request (opaque, prefix fbp_).
  parameters:
    CoreId:
      name: core_id
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$' }
      example: melondsds
    CoreVersion:
      name: version
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9A-Za-z][0-9A-Za-z.+_-]{0,63}$' }
      example: 1.4.0
    PluginId:
      name: plugin_id
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9-]+(\.[a-z0-9-]+)+$', maxLength: 128 }
      example: net.example.tracker
    PluginVersion:
      name: version
      in: path
      required: true
      schema: { type: string, maxLength: 128 }
      example: 1.2.0
    CorePlatform:
      name: platform
      in: path
      required: true
      schema: { $ref: '#/components/schemas/CorePlatform' }
      example: linux-x64
    GameId:
      name: game_id
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 9a1b2c3d-4e5f-4a6b-8c7d-0e1f2a3b4c5d
    SessionId:
      name: session_id
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 4e8d2a60-7b1c-4f3e-8a5d-6c7b8a9d0e1f
    UserId:
      name: user_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
      example: u_placeholder_2
    SaveSlotName:
      name: slot
      in: path
      required: true
      description: Slot name; always `default` in the PoC.
      schema: { type: string, pattern: '^[a-z0-9_-]{1,32}$' }
      example: default
    RunId:
      name: run_id
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 6f1d2c3b-4a5e-4b6c-8d7e-9f0a1b2c3d4e
    RunPluginId:
      name: plugin_id
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9-]+(\.[a-z0-9-]+)+$', maxLength: 128 }
      example: net.example.runnotes
  examples:
    SaveConflictValue:
      value:
        id: c_placeholder_1
        game_id: 9a1b2c3d-4e5f-4a6b-8c7d-0e1f2a3b4c5d
        slot: default
        status: open
        hub:
          revision: 3
          sha256: '1111111111111111111111111111111111111111111111111111111111111111'
          device_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
          device_name: Wohnzimmer-PC
          created_at: '2026-01-01T12:00:00Z'
        secured:
          version: 4
          sha256: '2222222222222222222222222222222222222222222222222222222222222222'
          base_revision: 2
          device_id: 5d0f4e2a-1b3c-4d5e-8f60-718293a4b5c6
          device_name: Laptop
          created_at: '2026-01-01T13:00:00Z'
        created_at: '2026-01-01T13:00:00Z'
        resolved_at: null
        resolved_by: null
    SaveSlotExample:
      value:
        game_id: 9a1b2c3d-4e5f-4a6b-8c7d-0e1f2a3b4c5d
        slot: default
        current:
          revision: 3
          sha256: '1111111111111111111111111111111111111111111111111111111111111111'
          size: 524288
          device_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
          device_name: Wohnzimmer-PC
          created_at: '2026-01-01T12:00:00Z'
          reason: checkpoint
        open_conflicts: []
    SaveSlotConflictExample:
      value:
        game_id: 9a1b2c3d-4e5f-4a6b-8c7d-0e1f2a3b4c5d
        slot: default
        current:
          revision: 3
          sha256: '1111111111111111111111111111111111111111111111111111111111111111'
          size: 524288
          device_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
          device_name: Wohnzimmer-PC
