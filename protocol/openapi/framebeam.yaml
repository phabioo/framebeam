        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/SessionForbidden' }
        '404': { $ref: '#/components/responses/SessionNotFound' }
        '410': { $ref: '#/components/responses/SessionEnded' }
    delete:
      operationId: withdrawSessionInvite
      tags: [sessions]
      summary: Withdraw an invite (owner device); removes that user's viewers
      security:
        - bearerAuth: []
      responses:
        '204': { description: Invite withdrawn }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/SessionForbidden' }
        '404': { $ref: '#/components/responses/SessionNotFound' }
        '410': { $ref: '#/components/responses/SessionEnded' }
  /api/v1/sessions/{session_id}/decline:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: declineSession
      tags: [sessions]
      summary: Decline the invite (invited user); the owner is notified via session_update
      security:
        - bearerAuth: []
      responses:
        '204': { description: Invite declined }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/SessionForbidden' }
        '404': { $ref: '#/components/responses/SessionNotFound' }
        '410': { $ref: '#/components/responses/SessionEnded' }
  /api/v1/sessions/{session_id}/join:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: joinSession
      tags: [sessions]
      summary: Join as viewer (ACL checked here)
      description: |
        Max 4 viewers (409 `session_full`). A device whose handshake reported `video.h264_decode=false` gets
        409 `capability_missing`. Joining again with the same device returns the existing viewer.
        Signaling continues over WSS (`signal`).
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Viewer created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionJoinResponse' }
              examples:
                default:
                  value:
                    viewer_id: 5d1f7c2e-3b4a-4c6d-9e8f-1a2b3c4d5e6f
                    permissions: { view_video: true, hear_audio: true, send_input: false }
                    ice_servers: ['stun:stun.example.org:3478']
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/SessionForbidden' }
        '404': { $ref: '#/components/responses/SessionNotFound' }
        '409': { $ref: '#/components/responses/SessionFullOrCapability' }
        '410': { $ref: '#/components/responses/SessionEnded' }
