<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>8d-6 Add a user to this PC</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/uzume/tokens.css">
<link rel="stylesheet" href="ds/uzume/components/bundle.css">
<script src="ds/uzume/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="uz" data-theme="{{ theme }}" style="width:1280px;height:800px;box-sizing:border-box;background:var(--ground);color:var(--ink);font-family:var(--font-sans);display:flex;flex-direction:column;overflow:hidden">
  <div style="height:84px;flex:none;display:flex;align-items:flex-start;justify-content:space-between;padding:32px 56px 0 28px">
    <x-import component-from-global-scope="Uzume.Lockup"></x-import>
    <span style="font:400 10px/16px var(--font-mono);letter-spacing:.06em;color:var(--dim);padding-top:2px">SWITCH USER · ADD</span>
  </div>
  <div style="flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 152px;column-gap:56px;padding:0 56px">
    <div style="position:relative;padding:40px 24px 24px;display:grid;grid-template-columns:400px minmax(0,1fr);column-gap:64px;align-items:start;min-width:0">
      <x-import component-from-global-scope="Uzume.RegisterMarks" inset="{{ zero }}"></x-import>
      <div style="display:flex;flex-direction:column;gap:28px">
        <div style="display:flex;flex-direction:column;gap:16px">
          <x-import component-from-global-scope="Uzume.SectionLabel" number="{{ n1 }}" meta="HOME SERVER">Add a user</x-import>
          <h1 style="margin:0;font-weight:300;font-size:40px;line-height:40px;letter-spacing:-0.02em;color:var(--ink)">Add someone to this PC</h1>
        </div>
        <div style="display:flex;flex-direction:column;gap:16px">
          <x-import component-from-global-scope="Uzume.TextField" label="Name" default-value="Sam"></x-import>
          <div style="display:flex;flex-direction:column;gap:8px">
            <x-import component-from-global-scope="Uzume.TextField" label="Password" type="password" placeholder="Password" state="focus"></x-import>
            <a href="#forgot" style="align-self:flex-start;font-size:12px;line-height:18px;color:var(--accent-text);text-decoration:none">Forgot password?</a>
          </div>
        </div>
        <div style="display:flex;gap:8px"><x-import component-from-global-scope="Uzume.Button" variant="primary">Sign in</x-import><x-import component-from-global-scope="Uzume.Button">Use an invite</x-import></div>
        <p style="margin:0;padding-top:16px;border-top:1px solid var(--rule-2);font-size:12px;line-height:18px;color:var(--muted)">No password? Max approves this PC for Sam (same as 8b-5g). New here? Use an invite.</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px;padding-top:4px">
        <x-import component-from-global-scope="Uzume.SectionLabel" number="{{ n2 }}">After signing in</x-import>
        <p style="margin:0;padding-top:12px;border-top:1px solid var(--rule);font-size:12px;line-height:18px;color:var(--muted)">Sam joins the people on this PC and can add a PIN in My account (8e). Others stay signed in.</p>
      </div>
    </div>
    <x-import component-from-global-scope="Uzume.OpenColumn" label="UZUME · SWITCH USER · ADD" lines="{{ oc }}"></x-import>
  </div>
  <div style="height:44px;flex:none;border-top:1px solid var(--rule-2);display:flex;align-items:center;justify-content:flex-end;gap:24px;padding:0 56px">
    <x-import component-from-global-scope="Uzume.GamepadHint" k="A" label="Choose"></x-import>
    <x-import component-from-global-scope="Uzume.GamepadHint" k="Y" label="Keyboard"></x-import>
    <x-import component-from-global-scope="Uzume.GamepadHint" k="B" label="Back"></x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["sumi","kinari"],"default":"sumi","tsType":"string"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'sumi', zero: 0, n1: 1, n2: 2, oc: ['HOME SERVER', 'APPROVAL WITHOUT PASSWORD'] };
  }
}
</script>
</body>
</html>
