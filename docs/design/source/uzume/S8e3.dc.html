<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>8e-3 Change password</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/uzume/tokens.css">
<link rel="stylesheet" href="ds/uzume/components/bundle.css">
<script src="ds/uzume/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="uz" data-theme="{{ theme }}" style="position:relative;width:1280px;height:800px;overflow:hidden;font-family:var(--font-sans)">
  <dc-import name="S8e1" theme="{{ theme }}" hint-size="1280px,800px"></dc-import>
  <div style="position:absolute;inset:0;z-index:8;background:var(--scrim);display:flex;align-items:center;justify-content:center;gap:24px">
    <x-import component-from-global-scope="Uzume.Dialog" label="My account · Max" title="Change password" text="Your other devices stay signed in. To sign them out, use Sign out everywhere." actions="{{ act }}" on-close="{{ noop }}"><x-import component-from-global-scope="Uzume.TextField" label="Current password" type="password" default-value="abcdefghijkl"></x-import><x-import component-from-global-scope="Uzume.TextField" label="New password" type="password" default-value="abcdefgh" error="At least 12 characters."></x-import><x-import component-from-global-scope="Uzume.TextField" label="New password again" type="password" placeholder="Repeat"></x-import></x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["sumi","kinari"],"default":"sumi","tsType":"string"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  baseVals() { return { theme: this.props.theme ?? 'sumi', yes: true }; }
  renderVals() {
    const h = React.createElement, U = window.Uzume;
    const B = (l, v, o) => h(U.Button, Object.assign({ key: l, variant: v }, o || {}), l);
    const G = (k, l) => h(U.GamepadHint, { key: k + l, k: k, label: l });
    const K = (k, l) => h(U.Kbd, { key: String(k) + (l || ''), keys: k, label: l });
    const M = (t) => h('span', { key: t, style: { fontFamily: 'var(--font-mono)', fontSize: 11, color: 'var(--ink-2)' } }, t);
    const T = (...parts) => h('span', null, ...parts);
    return Object.assign(this.baseVals(), { noop: () => {}, act: [B('Change', 'primary', { disabled: true }), B('Cancel')] });
  }
}
</script>
</body>
</html>
