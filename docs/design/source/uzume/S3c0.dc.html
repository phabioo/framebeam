<!doctype html>

        <div style="display:flex;flex-direction:column;gap:4px"><span style="font:500 10px/16px var(--font-mono);letter-spacing:.14em;color:var(--dim)">RECENT</span><span style="font-size:14px;line-height:22px">Clocktower Kids</span><span style="font:400 10px/16px var(--font-mono);color:var(--dim)">NDS · 16 OCT</span></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;align-items:center;gap:16px"><div style="display:flex;gap:8px;flex-wrap:wrap"><x-import component-from-global-scope="Uzume.FilterChip" selected="{{ yes }}">All · 10</x-import><x-import component-from-global-scope="Uzume.FilterChip">Favourites · 3</x-import><x-import component-from-global-scope="Uzume.FilterChip">Couch co-op · 4</x-import><x-import component-from-global-scope="Uzume.FilterChip">Nuzlocke · 2</x-import><x-import component-from-global-scope="Uzume.FilterChip">+ Collection</x-import></div><span style="margin-left:auto"><x-import component-from-global-scope="Uzume.Select" options="{{ sort }}" default-value="Recently played" aria-label="Sort" style="width:180px"></x-import></span></div>
        <div class="uz-table" style="position:relative"><x-import component-from-global-scope="Uzume.TableHead"></x-import><x-import component-from-global-scope="Uzume.TableRow" no="01" title="Lumen Drift" system="GBA" played="12 h 40 min" last="2 h ago" state="selected"></x-import><x-import component-from-global-scope="Uzume.TableRow" no="02" title="Harbor Rally" system="NDS" played="31 h" last="Yesterday"></x-import><x-import component-from-global-scope="Uzume.TableRow" no="03" title="Clocktower Kids" system="NDS" played="4 h 05 min" last="16 Oct"></x-import><x-import component-from-global-scope="Uzume.TableRow" no="04" title="Coral Saga: Ember" system="3DS" played="58 h" last="12 Oct"></x-import><x-import component-from-global-scope="Uzume.TableRow" no="05" title="Paper Wizards" system="GBC" played="45 min" last="3 Oct"></x-import></div>
      </div>
    </div>
    <div style="padding-top:48px;display:flex;min-height:0"><x-import component-from-global-scope="Uzume.OpenColumn" label="UZUME · LIBRARY · HOME SERVER" lines="{{ oc }}"></x-import></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["sumi","kinari"],"default":"sumi","tsType":"string"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const h = React.createElement, U = window.Uzume;

    const M = (t) => h('span', { key: t, style: { fontFamily: 'var(--font-mono)', fontSize: 11, color: 'var(--ink-2)' } }, t);
    const T = (...parts) => h('span', null, ...parts);
    return Object.assign({ theme: this.props.theme ?? 'sumi' }, {"n1": 1, "n2": 2, "n3": 3, "n4": 4, "zero": 0, "one": 1, "three": 3, "yes": true, "no": false, "s20": 20, "s28": 28, "s40": 40, "badges": {"Users": 1, "Reports": 2}, "online": [{"name": "Lena", "person": "momo", "playing": "Lumen Drift"}, {"name": "Jonas", "person": "moegi", "playing": "Harbor Rally"}], "max": {"name": "Max", "role": "Admin", "person": "wasurenagusa"}, "lena": {"name": "Lena", "role": "Member", "person": "momo"}, "local": {"name": "Max", "role": "This PC", "person": "wasurenagusa"}, "onlineM": [{"name": "Max", "person": "wasurenagusa", "playing": "Coral Saga: Ember"}, {"name": "Jonas", "person": "moegi", "playing": "Harbor Rally"}], "libtabs": ["Games", "Saves", "Screenshots"], "sort": ["Recently played", "Name", "Play time"], "oc": ["10 GAMES", "3 FAVOURITES", "2 COLLECTIONS"]}, { noop: () => {},  });

</script>
</body>
</html>
