<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>8d-1 Switch user · gamepad</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/uzume/tokens.css">
<link rel="stylesheet" href="ds/uzume/components/bundle.css">
<script src="ds/uzume/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;text-align:left;cursor:pointer}
</style>
</helmet>
<div class="uz" data-theme="{{ theme }}" style="width:1280px;height:800px;box-sizing:border-box;background:var(--ground);color:var(--ink);font-family:var(--font-sans);display:flex;flex-direction:column;overflow:hidden">
  <div style="height:84px;flex:none;display:flex;align-items:flex-start;justify-content:space-between;padding:32px 56px 0 28px">
    <x-import component-from-global-scope="Uzume.Lockup"></x-import>
    <span style="font:400 10px/16px var(--font-mono);letter-spacing:.06em;color:var(--dim);padding-top:2px">DESKTOP-LIVINGROOM · HOME SERVER</span>
  </div>
  <div style="flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 152px;column-gap:56px;padding:0 56px">
    <div style="position:relative;padding:40px 24px 24px;display:flex;flex-direction:column;gap:40px;min-width:0">
      <x-import component-from-global-scope="Uzume.RegisterMarks" inset="{{ zero }}"></x-import>
      <div style="display:flex;flex-direction:column;gap:16px">
        <x-import component-from-global-scope="Uzume.SectionLabel" number="{{ n1 }}" meta="3 PEOPLE ON THIS PC">Switch user</x-import>
        <h1 style="margin:0;font-weight:300;font-size:40px;line-height:40px;letter-spacing:-0.02em;color:var(--ink)">Who’s playing?</h1>
        <p style="margin:0;font-size:14px;line-height:22px;color:var(--ink-2)">People signed in on Desktop-LivingRoom. Saves always go to the person who is signed in.</p>
      </div>
      <div role="list" style="display:grid;grid-template-columns:repeat(4,200px);column-gap:24px">
        <button type="button" role="listitem" style="display:flex;flex-direction:column;gap:12px;padding:20px 16px;border-top:1px solid var(--rule)"><x-import component-from-global-scope="Uzume.Avatar" name="Max" person="wasurenagusa" size="{{ s40 }}"></x-import><span style="display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;line-height:22px;font-weight:500;color:var(--ink)">Max</span><span style="font-size:12px;line-height:18px;color:var(--muted)">Admin · today</span></span></button>
        <button type="button" role="listitem" aria-label="Lena, PIN" style="display:flex;flex-direction:column;gap:12px;padding:20px 16px;border-top:1px solid var(--rule);background:var(--hover);box-shadow:var(--focus-ring);position:relative;z-index:1"><x-import component-from-global-scope="Uzume.Avatar" name="Lena" person="momo" size="{{ s40 }}"></x-import><span style="display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;line-height:22px;font-weight:500;color:var(--ink)">Lena</span><span style="font-size:12px;line-height:18px;color:var(--muted)">Last used 2 days ago</span></span><span style="font:400 10px/16px var(--font-mono);letter-spacing:.06em;color:var(--muted)">PIN</span></button>
        <button type="button" role="listitem" style="display:flex;flex-direction:column;gap:12px;padding:20px 16px;border-top:1px solid var(--rule)"><x-import component-from-global-scope="Uzume.Avatar" name="Jonas" person="moegi" size="{{ s40 }}"></x-import><span style="display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;line-height:22px;font-weight:500;color:var(--ink)">Jonas</span><span style="font-size:12px;line-height:18px;color:var(--muted)">Last week</span></span></button>
        <button type="button" role="listitem" style="display:flex;flex-direction:column;gap:12px;padding:20px 16px;border-top:1px solid var(--rule)"><span style="width:40px;height:40px;box-sizing:border-box;border:1px solid var(--rule);display:grid;place-items:center;font:400 16px/1 var(--font-mono);color:var(--muted)">+</span><span style="display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;line-height:22px;font-weight:500;color:var(--ink)">Add user</span><span style="font-size:12px;line-height:18px;color:var(--muted)">Sign in someone else</span></span></button>
      </div>
    </div>
    <x-import component-from-global-scope="Uzume.OpenColumn" label="UZUME · SWITCH USER" lines="{{ oc }}"></x-import>
  </div>
  <div style="height:44px;flex:none;border-top:1px solid var(--rule-2);display:flex;align-items:center;justify-content:flex-end;gap:24px;padding:0 56px">
    <x-import component-from-global-scope="Uzume.GamepadHint" k="A" label="Choose"></x-import>
    <x-import component-from-global-scope="Uzume.GamepadHint" k="X" label="Remove from this PC"></x-import>
    <x-import component-from-global-scope="Uzume.GamepadHint" k="B" label="Back"></x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["sumi","kinari"],"default":"sumi","tsType":"string"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'sumi', zero: 0, n1: 1, s40: 40, oc: ['CTRL SHIFT U', 'HOLD SELECT + ↑', 'SAVES GO TO WHO PLAYS'] };
  }
}
</script>
</body>
</html>
