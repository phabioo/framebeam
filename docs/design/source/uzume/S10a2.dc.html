<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>10a-2 Game page · delete a variant</title>

<link rel="stylesheet" href="ds/uzume/tokens.css">
<link rel="stylesheet" href="ds/uzume/components/bundle.css">
<script src="ds/uzume/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}[style*="grid-template-rows"] .uz-toast{min-width:0;width:100%;box-sizing:border-box;height:auto;min-height:44px;padding-top:10px;padding-bottom:10px}[style*="grid-template-rows"] .uz-toast-action{white-space:nowrap}</style></helmet>
<div class="uz" data-theme="{{ theme }}" style="position:relative;width:1280px;height:800px;overflow:hidden;font-family:var(--font-sans)">
  <dc-import name="S10a1" theme="{{ theme }}" hint-size="1280px,800px"></dc-import>
  <div style="position:absolute;inset:0;z-index:8;background:var(--scrim);display:flex;align-items:center;justify-content:center;gap:24px">
    <x-import component-from-global-scope="Uzume.Dialog" label="LIBRARY · CORAL SAGA: EMBER" title="Delete Chaos night?" text="The variant’s files go from this PC. Its slot has 9 save versions on Home server." size="lg" actions="{{ act }}" hints="{{ hints }}" on-close="{{ noop }}"><x-import component-from-global-scope="Uzume.Segmented" items="{{ keep }}" active="Keep saves" label="Saves of Chaos night"></x-import><span style="font-size:12px;line-height:18px;color:var(--muted)">Kept saves stay on Home server in the slot Chaos night, with the recipe. Build it again later to play them.</span></x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["sumi","kinari"],"default":"sumi","tsType":"string"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const h = React.createElement, U = window.Uzume;
    const B = (l, v, o) => h(U.Button, Object.assign({ key: l, variant: v }, o || {}), l);
    const G = (k, l) => h(U.GamepadHint, { key: k + l, k: k, label: l });
    const K = (k, l) => h(U.Kbd, { key: String(k) + (l || ''), keys: k, label: l });
    const M = (t) => h('span', { key: t, style: { fontFamily: 'var(--font-mono)', fontSize: 11, color: 'var(--ink-2)' } }, t);
    const T = (...parts) => h('span', null, ...parts);
    return Object.assign({ theme: this.props.theme ?? 'sumi' }, {"n1": 1, "n2": 2, "n3": 3, "n4": 4, "zero": 0, "one": 1, "three": 3, "yes": true, "no": false, "s20": 20, "s28": 28, "s40": 40, "badges": {"Users": 1, "Reports": 2}, "online": [{"name": "Lena", "person": "momo", "playing": "Lumen Drift"}, {"name": "Jonas", "person": "moegi", "playing": "Harbor Rally"}], "max": {"name": "Max", "role": "Admin", "person": "wasurenagusa"}, "lena": {"name": "Lena", "role": "Member", "person": "momo"}, "local": {"name": "Max", "role": "This PC", "person": "wasurenagusa"}, "onlineM": [{"name": "Max", "person": "wasurenagusa", "playing": "Coral Saga: Ember"}, {"name": "Jonas", "person": "moegi", "playing": "Harbor Rally"}], "groups": [{"head": "Play", "items": ["Library", "Runs", "Emulation", "Controllers"]}, {"head": "Server", "server": true, "items": ["Status", "Users", "Systems & cores", "Tools", "Plugins", "Reports"]}], "keep": ["Keep saves", "Delete saves too"]}, { noop: () => {}, act: [B('Delete variant', 'danger'), B('Cancel', '', { state: 'focus' })], hints: [G('LeftRight', 'Choose'), G('A', 'Confirm'), G('B', 'Cancel')] });
  }
}
</script>
</body>
</html>
