<!doctype html>
<html lang="en">
<head>

<link rel="stylesheet" href="ds/uzume/components/bundle.css">

</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="uz" data-theme="{{ theme }}" style="position:relative;width:1280px;height:800px;box-sizing:border-box;background:var(--ground);color:var(--ink);font-family:var(--font-sans);display:flex;flex-direction:column;overflow:hidden">

    <div style="position:relative;flex:1;min-width:0;display:flex;align-items:center;justify-content:center;background:var(--stage);overflow:hidden">

    </div>
    <div style="width:320px;flex:none;border-left:1px solid var(--rule);display:flex;flex-direction:column;min-height:0;background:var(--ground)">

          <div style="display:grid;grid-template-columns:56px minmax(0,1fr);column-gap:12px;align-items:center;padding:8px 8px 8px 8px;border-bottom:1px solid var(--rule-2);"><span style="height:38px;border:1px solid var(--placeholder-rule);background:var(--placeholder);display:grid;place-items:center;font:500 10px/1 var(--font-mono);color:var(--muted)">3</span><span style="display:flex;flex-direction:column;min-width:0"><span style="display:flex;align-items:center;gap:8px;font-size:13px;line-height:18px;">Slot 3</span><span style="font-size:12px;line-height:18px;color:var(--muted)">16 Oct · 8 h 02 min</span></span></div>
          <div style="display:grid;grid-template-columns:56px minmax(0,1fr);column-gap:12px;align-items:center;padding:8px;border-bottom:1px solid var(--rule-2)"><span style="height:38px;border:1px dashed var(--placeholder-rule)"></span><span style="font-size:12px;line-height:18px;color:var(--muted)">Slot 4 · empty · select and press F6</span></div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;"><x-import component-from-global-scope="Uzume.Button" variant="primary" size="sm">Save to 2</x-import><x-import component-from-global-scope="Uzume.Button" size="sm">Load 2</x-import><x-import component-from-global-scope="Uzume.Menu" items="{{ smenu }}" label="State 2"></x-import></div>
        <span style="font-size:12px;line-height:18px;color:var(--muted)">States are not your save. Main v14 changes only when the game saves.</span>
      </div>
      <div style="padding:12px 24px;border-top:1px solid var(--rule-2);display:flex;gap:16px;flex-wrap:wrap"><x-import component-from-global-scope="Uzume.Kbd" keys="F6" label="Save"></x-import><x-import component-from-global-scope="Uzume.Kbd" keys="F8" label="Load"></x-import><x-import component-from-global-scope="Uzume.Kbd" keys="Shift+F6" label="Next slot"></x-import></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["sumi","kinari"],"default":"sumi","tsType":"string"},"$preview":{"width":1280,"height":800}}'>
