        <h1 style="margin:0;font-weight:300;font-size:40px;line-height:40px;letter-spacing:-0.02em;color:var(--ink)">Cheat database</h1>

      <div style="border-top:1px solid var(--rule)">

      <div style="display:flex;align-items:center;gap:8px"><x-import component-from-global-scope="Uzume.StatusIcon" kind="done" size="sm">Up to date</x-import><span style="font:400 10px/16px var(--font-mono);letter-spacing:.06em;color:var(--dim)">DB 2026-10-23 · 18 MB</span></div>
    </div>
    <div style="padding-top:48px;display:flex;min-height:0"><x-import component-from-global-scope="Uzume.HelpColumn" label="UZUME · SETTINGS · THIS PC" items="{{ help }}"></x-import></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["sumi","kinari"],"default":"sumi","tsType":"string"},"$preview":{"width":1280,"height":800}}'>
