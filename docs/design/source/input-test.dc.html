<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:grid;grid-template-columns:repeat(7,36px);grid-template-rows:repeat(5,36px);gap:6px;justify-content:center">
  <sc-for list="{{ cells }}" as="c" hint-placeholder-count="14">
    <div style="grid-area:{{ c.area }};display:flex">
      <dc-import name="pad-glyph" g="{{ c.g }}" size="{{ 36 }}" active="{{ c.on }}" square="{{ c.square }}" fill="{{ true }}" style="flex:1;display:flex" hint-size="36px,36px"></dc-import>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:220},&quot;set&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;xbox&quot;,&quot;ps&quot;,&quot;generic&quot;],&quot;default&quot;:&quot;xbox&quot;,&quot;tsType&quot;:&quot;'xbox'|'ps'|'generic'&quot;},&quot;pressed&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[&quot;A&quot;,&quot;right&quot;],&quot;tsType&quot;:&quot;string[]&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const set = this.props.set ?? 'xbox', pressed = this.props.pressed ?? [];
    const L = {
      xbox: ['LT', 'RT', 'LB', 'RB', 'View', 'Menu', 'Y', 'X', 'B', 'A'],
      ps: ['L2', 'R2', 'L1', 'R1', 'Create', 'Options', 'triangle', 'square', 'circle', 'cross'],
      generic: ['L2', 'R2', 'L', 'R', 'Select', 'Start', 'X', 'Y', 'A', 'B'],
    }[set] || [];
    const pos = ['1 / 1 / 2 / 3', '1 / 6 / 2 / 8', '2 / 1 / 3 / 3', '2 / 6 / 3 / 8', '2 / 3 / 3 / 4', '2 / 5 / 3 / 6', '3 / 6 / 4 / 7', '4 / 5 / 5 / 6', '4 / 7 / 5 / 8', '5 / 6 / 6 / 7'];
    const cells = L.map((g, i) => ({ g, area: pos[i], on: pressed.includes(g), square: false }))
      .concat([['up', '3 / 2 / 4 / 3'], ['left', '4 / 1 / 5 / 2'], ['right', '4 / 3 / 5 / 4'], ['down', '5 / 2 / 6 / 3']].map(([g, area]) => ({ g, area, on: pressed.includes(g), square: true })));
    return { cells };
  }
}
</script>
</body>
</html>
