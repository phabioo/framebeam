<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:grid;grid-template-columns:14px minmax(0,1fr) 280px 72px;align-items:start;padding:14px 0;border-bottom:1px solid #1f2024;background:{{ bg }};font-family:'IBM Plex Sans',system-ui,sans-serif">
  <div style="height:32px;display:flex;align-items:center"><sc-if value="{{ r.changed }}" hint-placeholder-val="{{ false }}"><span style="width:6px;height:6px;border-radius:50%;background:#3cbfd8"></span></sc-if></div>
  <div style="display:flex;flex-direction:column;gap:2px;min-width:0;padding-right:32px">
    <div style="display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;min-height:32px">
      <span style="font-size:14px;line-height:20px;color:{{ labelFg }}">{{ r.label }}</span>
      <sc-if value="{{ hasBadge }}" hint-placeholder-val="{{ false }}"><span style="font-size:11px;line-height:16px;padding:1px 6px;border-radius:4px;background:#232428;color:#a3a3a8;white-space:nowrap">{{ r.badge }}</span></sc-if>
      <sc-if value="{{ hasMeta }}" hint-placeholder-val="{{ false }}"><span style="font:400 11px 'IBM Plex Mono',monospace;color:#7d7d83;white-space:nowrap">{{ r.meta }}</span></sc-if>
    </div>
    <sc-if value="{{ collapsed }}" hint-placeholder-val="{{ false }}">
      <div style="max-width:560px;display:flex;flex-direction:column;gap:2px">
        <div style="font-size:12px;line-height:18px;color:#8e8e94;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:pretty">{{ intro }}</div>
        <span style="align-self:flex-start;font-size:12px;line-height:18px;color:#a3a3a8;text-decoration:underline;cursor:pointer">{{ moreLabel }}</span>
      </div>
    </sc-if>
    <sc-if value="{{ expanded }}" hint-placeholder-val="{{ false }}">
      <div style="max-width:560px;display:flex;flex-direction:column;gap:8px">
        <div style="font-size:12px;line-height:18px;color:#8e8e94;text-wrap:pretty">{{ intro }}</div>
        <sc-if value="{{ hasList }}" hint-placeholder-val="{{ false }}"><div style="display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:8px 12px;border-radius:6px;background:#16171a;font-size:12px;line-height:18px">
          <sc-for list="{{ list }}" as="it" hint-placeholder-count="3"><span style="color:#c9c8c4;font-weight:500;white-space:nowrap">{{ it.k }}</span><span style="color:#8e8e94;text-wrap:pretty">{{ it.v }}</span></sc-for>
        </div></sc-if>
        <span style="align-self:flex-start;font-size:12px;line-height:18px;color:#a3a3a8;text-decoration:underline;cursor:pointer">Less</span>
      </div>
    </sc-if>
    <sc-if value="{{ plain }}" hint-placeholder-val="{{ true }}"><div style="max-width:560px;font-size:12px;line-height:18px;color:#8e8e94;text-wrap:pretty">{{ intro }}</div></sc-if>
    <sc-if value="{{ hasReason }}" hint-placeholder-val="{{ false }}"><div style="font-size:12px;line-height:18px;color:#c9c8c4;margin-top:2px">⊘ {{ r.disabled }}</div></sc-if>
  </div>
  <div style="display:flex;justify-content:flex-end;align-items:center;min-height:32px;position:relative">
    <div style="display:flex;justify-content:flex-end;border-radius:8px;opacity:{{ ctrlOp }};box-shadow:{{ ring }};width:{{ ctrlW }}">
      <sc-if value="{{ isToggle }}" hint-placeholder-val="{{ true }}">
        <sc-if value="{{ on }}" hint-placeholder-val="{{ false }}"><div style="width:40px;height:22px;border-radius:11px;position:relative;background:#3cbfd8;margin:5px 0"><div style="position:absolute;top:3px;left:21px;width:16px;height:16px;border-radius:50%;background:#ecebe7"></div></div></sc-if>
        <sc-if value="{{ off }}" hint-placeholder-val="{{ true }}"><div style="width:40px;height:22px;border-radius:11px;position:relative;background:#2c2d32;margin:5px 0"><div style="position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#ecebe7"></div></div></sc-if>
      </sc-if>
      <sc-if value="{{ isSeg }}" hint-placeholder-val="{{ false }}">
        <div style="width:100%;box-sizing:border-box;height:32px;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;padding:3px;border-radius:7px;background:#1a1b1e;border:1px solid #2c2d32">
          <sc-for list="{{ opts }}" as="v" hint-placeholder-count="3">
            <sc-if value="{{ v.on }}" hint-placeholder-val="{{ false }}"><div style="border-radius:5px;background:#2c2d32;color:#ecebe7;font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px">{{ v.label }}</div></sc-if>
            <sc-if value="{{ v.off }}" hint-placeholder-val="{{ true }}"><div style="border-radius:5px;color:#a3a3a8;font-size:13px;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px">{{ v.label }}</div></sc-if>
          </sc-for>
        </div>
      </sc-if>
      <sc-if value="{{ isSelect }}" hint-placeholder-val="{{ false }}">
        <div style="width:100%;box-sizing:border-box;height:32px;border-radius:6px;background:#1a1b1e;border:1px solid {{ selLine }};display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;font-size:13px;color:#ecebe7"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.value }}</span><span style="margin-left:auto;color:#7d7d83;font-size:11px">▾</span></div>
      </sc-if>
      <sc-if value="{{ isButtons }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;gap:8px;justify-content:flex-end"><sc-for list="{{ buttons }}" as="b" hint-placeholder-count="1"><div style="height:32px;padding:0 14px;border-radius:7px;border:1px solid #3a3b40;display:flex;align-items:center;font-size:13px;font-weight:500;white-space:nowrap;color:#ecebe7">{{ b }}</div></sc-for></div>
      </sc-if>
      <sc-if value="{{ isValue }}" hint-placeholder-val="{{ false }}"><span style="font:400 13px 'IBM Plex Mono',monospace;color:#c9c8c4;line-height:32px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.value }}</span></sc-if>
    </div>
    <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;top:36px;right:0;width:280px;box-sizing:border-box;z-index:5;padding:4px;border-radius:8px;background:#1d1e22;border:1px solid #34353a;box-shadow:0 18px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;max-height:300px;overflow:hidden">
        <sc-for list="{{ menu }}" as="m" hint-placeholder-count="6">
          <sc-if value="{{ m.on }}" hint-placeholder-val="{{ false }}"><div style="flex:none;height:30px;display:grid;grid-template-columns:16px minmax(0,1fr);align-items:center;gap:6px;padding:0 8px;border-radius:5px;background:#2c2d32;font-size:13px;color:#ecebe7"><span style="color:#3cbfd8">✓</span><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ m.label }}</span></div></sc-if>
          <sc-if value="{{ m.off }}" hint-placeholder-val="{{ true }}"><div style="flex:none;height:30px;display:grid;grid-template-columns:16px minmax(0,1fr);align-items:center;gap:6px;padding:0 8px;font-size:13px;color:#c9c8c4"><span></span><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ m.label }}</span></div></sc-if>
        </sc-for>
        <div style="flex:none;padding:6px 8px 2px;font-size:11px;color:#7d7d83;border-top:1px solid #2c2d32;margin-top:2px">Scroll for more · type to jump</div>
      </div>
    </sc-if>
  </div>
  <div style="height:32px;display:flex;align-items:center;justify-content:flex-end;font-size:12px">
    <sc-if value="{{ showReset }}" hint-placeholder-val="{{ false }}"><span style="color:#a3a3a8;text-decoration:underline;cursor:pointer">Reset</span></sc-if>
    <sc-if value="{{ showDefault }}" hint-placeholder-val="{{ true }}"><span style="color:#5e5e63">Default</span></sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:840,&quot;height&quot;:120},&quot;row&quot;:{&quot;editor&quot;:null,&quot;default&quot;:{&quot;label&quot;:&quot;Render Mode&quot;,&quot;desc&quot;:&quot;Software is fastest and most accurate. OpenGL (Classic) can scale up 3D graphics.\n- Software: Most accurate, no upscaling.\n- OpenGL (Classic): Upscaling, some games render wrong.&quot;,&quot;ctrl&quot;:&quot;select&quot;,&quot;value&quot;:&quot;OpenGL (Compute)&quot;,&quot;changed&quot;:true,&quot;badge&quot;:&quot;applies on next start&quot;},&quot;tsType&quot;:&quot;{label,desc,ctrl:'toggle'|'seg'|'select'|'buttons'|'value',value?,on?,opts?,menu?,buttons?,changed?,badge?,meta?,disabled?,expanded?,state?:'hover'|'focus',reset?:'none'}&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const r = this.props.row || { label: 'Setting', desc: 'Description', ctrl: 'toggle', on: true };
    const c = r.ctrl || 'toggle';
    // Parse plain-text core description: lines "Option: explanation" (optionally "- " prefixed) become a list.
    const lines = String(r.desc || '').split('\n').map(s => s.trim()).filter(Boolean);
    const list = [], intro = [];
    lines.forEach((l, i) => { const bullet = /^[-•]\s*/.test(l), m = l.replace(/^[-•]\s*/, '').match(/^([^:]{1,28}):\s+(.+)$/); if (m && (bullet || i > 0)) list.push({ k: m[1], v: m[2] }); else intro.push(l.replace(/^[-•]\s*/, '')); });
    const introText = intro.join(' ');
    const long = list.length > 0 || introText.length > 150;
    const mode = !long ? 'plain' : (r.expanded ? 'expanded' : 'collapsed');
    const opts = (r.opts || []).map(o => ({ label: o, on: o === r.value, off: o !== r.value }));
    const menu = (r.menu || []).map(o => ({ label: o, on: o === r.value, off: o !== r.value }));
    const dis = !!r.disabled;
    return {
      r, intro: introText, list, hasList: list.length > 0,
      collapsed: mode === 'collapsed', expanded: mode === 'expanded', plain: mode === 'plain',
      moreLabel: list.length ? 'More · ' + list.length + ' options' : 'More',
      hasBadge: !!r.badge, hasMeta: !!r.meta, hasReason: dis,
      isToggle: c === 'toggle', isSeg: c === 'seg', isSelect: c === 'select', isButtons: c === 'buttons', isValue: c === 'value',
      on: !!r.on, off: !r.on, opts, buttons: r.buttons || [], menu, menuOpen: menu.length > 0,
      ctrlW: c === 'seg' || c === 'select' ? '280px' : 'auto',
      selLine: menu.length ? '#3cbfd8' : '#2c2d32',
      bg: r.state === 'hover' ? '#17181b' : 'transparent',
      ring: r.state === 'focus' ? '0 0 0 2px #121315,0 0 0 4px #3cbfd8' : 'none',
      labelFg: dis ? '#8e8e94' : '#ecebe7', ctrlOp: dis ? 0.4 : 1,
      showReset: r.reset !== 'none' && !!r.changed, showDefault: r.reset !== 'none' && !r.changed
    };
  }
}
</script>
</body>
</html>
